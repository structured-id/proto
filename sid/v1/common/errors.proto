// StructuredID gRPC Error Model.
//
// Machine-readable error reason codes for programmatic handling.
// Used with google.rpc.ErrorInfo as status detail.
//
// Domain: "sid" for all CE/EE services, "sid.ee" for EE-specific errors.
// See: arch/infra/api-architecture.md §gRPC Error Model

syntax = "proto3";

package sid.v1.common;

// Machine-readable error reason codes.
//
// Each code maps to a specific gRPC status code (see comments).
// Clients switch on `reason` field of google.rpc.ErrorInfo for
// programmatic error handling.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // ── NOT_FOUND ──────────────────────────────────────────────

  // Profile does not exist.
  PROFILE_NOT_FOUND = 1;
  // OAuth2 application/client not found.
  APPLICATION_NOT_FOUND = 2;
  // Session not found or expired.
  SESSION_NOT_FOUND = 3;
  // Credential not found.
  CREDENTIAL_NOT_FOUND = 4;
  // Role not found.
  ROLE_NOT_FOUND = 5;
  // Project not found.
  PROJECT_NOT_FOUND = 6;
  // No OIDC issuer has this handle. The request is refused before any
  // authentication or key lookup; it never falls back to another issuer.
  OIDC_ISSUER_NOT_FOUND = 7;
  // Protected resource not found.
  RESOURCE_NOT_FOUND = 8;

  // ── UNAUTHENTICATED ────────────────────────────────────────

  // Invalid credentials (password, WebAuthn assertion, etc.).
  // Security: status.message MUST be generic ("authentication failed").
  AUTHENTICATION_FAILED = 10;
  // Access token expired.
  TOKEN_EXPIRED = 11;
  // Token malformed, invalid signature, or wrong issuer.
  TOKEN_INVALID = 12;

  // ── PERMISSION_DENIED ──────────────────────────────────────

  // Caller lacks required permissions (RBAC/ReBAC/Cedar denied).
  INSUFFICIENT_PERMISSIONS = 20;
  // OAuth2 scope not granted for this operation.
  SCOPE_NOT_GRANTED = 21;

  // ── ALREADY_EXISTS ─────────────────────────────────────────

  // Profile with this identifier already exists.
  PROFILE_ALREADY_EXISTS = 30;
  // Email address already registered.
  EMAIL_ALREADY_REGISTERED = 31;
  // Username already taken.
  USERNAME_ALREADY_TAKEN = 32;
  // The operation key already names a command with a different method or
  // inputs; a new command needs a new key.
  OPERATION_KEY_CONFLICT = 33;
  // The application already has a role of this kind (one client role and one
  // resource role per application).
  APPLICATION_ROLE_EXISTS = 34;
  // The issuer already has, or had, a protected resource with this resource
  // indicator; an indicator is never given to another resource.
  RESOURCE_INDICATOR_TAKEN = 35;

  // ── INVALID_ARGUMENT ───────────────────────────────────────

  // Field value does not pass validation.
  INVALID_FIELD_VALUE = 40;
  // Required field is missing.
  REQUIRED_FIELD_MISSING = 41;

  // ── FAILED_PRECONDITION ────────────────────────────────────

  // MFA enrollment required before proceeding.
  MFA_REQUIRED = 50;
  // Account suspended by administrator.
  ACCOUNT_SUSPENDED = 51;
  // Account locked due to brute-force protection.
  ACCOUNT_LOCKED = 52;
  // User consent required before granting access.
  CONSENT_REQUIRED = 53;
  // Credential has been revoked.
  CREDENTIAL_REVOKED = 54;
  // Account is in closure/quarantine state.
  ACCOUNT_CLOSED = 55;
  // The operation completed, but its result is no longer kept; it is not
  // executed again.
  OPERATION_RESULT_UNAVAILABLE = 56;
  // The operation is outside the window in which a retry is admitted.
  OPERATION_EXPIRED = 57;
  // The protected resource is retired with its application: it takes no
  // changes and no access.
  RESOURCE_RETIRED = 58;
  // The client and the resource belong to different issuers; access is
  // granted only within one issuer.
  ISSUER_MISMATCH = 59;

  // ── RESOURCE_EXHAUSTED ─────────────────────────────────────

  // Rate limit exceeded (login attempts, API calls, etc.).
  RATE_LIMIT_EXCEEDED = 60;

  // ── ABORTED ────────────────────────────────────────────────

  // Concurrent modification detected (optimistic locking).
  CONCURRENT_MODIFICATION = 70;
  // The same logical operation is still executing; retry it later with the
  // same key.
  OPERATION_IN_PROGRESS = 71;

  // ── UNKNOWN ────────────────────────────────────────────────

  // The operation's outcome cannot be established yet; retry it with the
  // same key, never with a new one.
  OPERATION_OUTCOME_UNKNOWN = 95;

  // ── UNIMPLEMENTED ──────────────────────────────────────────

  // Feature requires EE license.
  EE_FEATURE_REQUIRED = 80;

  // ── INTERNAL ───────────────────────────────────────────────

  // Unrecoverable internal error.
  INTERNAL_ERROR = 90;
}
