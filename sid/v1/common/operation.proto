// StructuredID operation retry rules.
// How a call of a method that changes state is safe to repeat after its
// response was lost, declared on the method itself.
syntax = "proto3";

package sid.v1.common;

import "google/protobuf/descriptor.proto";

// The retry rule of one method.
message RetryRule {
  oneof rule {
    // The caller names its command by an operation key: the
    // `idempotency-key` request metadata (the Idempotency-Key header of
    // draft-ietf-httpapi-idempotency-key-header), an opaque value created
    // once before the first submission and kept across every retry. A retry
    // under the same key answers with the result recorded by the first
    // commit and applies nothing again; a call without a key is refused
    // before any effect.
    bool keyed = 3;
    // The method follows its protocol's own consume or replay rule, stated
    // here with the normative section where the protocol is standardized
    // (for example RFC 6749 §4.1.2 for an authorization code). Its result
    // is never replayed from a recorded answer.
    string ceremony = 1;
    // The method's effect is the same however often it is applied: the
    // invariant that makes it so and what a repeat answers, including after
    // an intervening change.
    string natural = 2;
  }
}

extend google.protobuf.MethodOptions {
  // The retry rule of a method whose idempotency_level is not
  // NO_SIDE_EFFECTS. Every such method declares it.
  RetryRule retry = 51200;
}
