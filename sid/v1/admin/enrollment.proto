// StructuredID Enrollment Policy Service
// Registration gating (enrollment modes), invite management, and registration
// source analytics. Controls who can register and how registration is tracked.
// Admin role required for every RPC except GetEnrollmentPolicy and
// GetInstanceStatus, which the registration page reads before anyone signs in.
//
// Arch doc: auth/enrollment-policy.md
syntax = "proto3";

package sid.v1.admin;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// EnrollmentService manages registration gating policies, invite codes,
// and registration source analytics.
//
// CE ships 4 hardcoded enrollment modes (Open, InviteOnly, AdminOnly,
// DomainRestricted). EE adds per-application overrides and pluggable rules.
service EnrollmentService {
  // ── Enrollment Policy ──

  // Get the current enrollment policy.
  rpc GetEnrollmentPolicy(google.protobuf.Empty) returns (EnrollmentPolicy) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/enrollment/policy" };
  }

  // Whether the installation has been claimed by its first administrator.
  // Public: while unclaimed, the registration page asks for the claim token.
  rpc GetInstanceStatus(google.protobuf.Empty) returns (InstanceStatus) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/enrollment/instance-status" };
  }

  // Update the enrollment policy (mode, domains, tracking).
  rpc UpdateEnrollmentPolicy(UpdateEnrollmentPolicyRequest) returns (EnrollmentPolicy) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { put: "/v1/admin/enrollment/policy" body: "*" };
  }

  // ── Invite Management ──

  // Create a new invite code.
  rpc CreateInvite(CreateInviteRequest) returns (Invite) {
    option (google.api.http) = { post: "/v1/admin/enrollment/invites" body: "*" };
  }

  // List invite codes (paginated, filterable by status).
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/enrollment/invites" };
  }

  // Revoke an invite code (deactivate, cannot be used anymore).
  rpc RevokeInvite(RevokeInviteRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/admin/enrollment/invites/{invite_id}/revoke" body: "*" };
  }

  // Bulk-generate invite codes.
  rpc BulkCreateInvites(BulkCreateInvitesRequest) returns (BulkCreateInvitesResponse) {
    option (google.api.http) = { post: "/v1/admin/enrollment/invites/bulk" body: "*" };
  }

  // ── Registration Analytics ──

  // Get registration statistics by source type for a given period.
  rpc GetRegistrationStats(GetRegistrationStatsRequest) returns (RegistrationStats) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/enrollment/stats" };
  }
}

// Whether the installation has its first administrator.
message InstanceStatus {
  // False while no administrator exists: self-registration then accepts only a
  // registration carrying the claim token from the service log, whatever the
  // enrollment mode. The token itself is never returned.
  bool claimed = 1;
}

// ══════════════════════════════════════════════════════════════════════════
// Enums
// ══════════════════════════════════════════════════════════════════════════

// Registration gating mode. CE: 4 hardcoded options.
// EE adds POLICY mode for composable rules.
enum EnrollmentMode {
  ENROLLMENT_MODE_UNSPECIFIED = 0;

  // Anyone can register. Default for new instances.
  ENROLLMENT_MODE_OPEN = 1;

  // Registration only with a valid invite code.
  ENROLLMENT_MODE_INVITE_ONLY = 2;

  // Only admin can create profiles (SCIM, admin-ui, API).
  // Self-registration disabled entirely.
  ENROLLMENT_MODE_ADMIN_ONLY = 3;

  // Only users with email in allowed domains can self-register.
  ENROLLMENT_MODE_DOMAIN_RESTRICTED = 4;
}

// How a profile was created.
enum RegistrationSourceType {
  REGISTRATION_SOURCE_TYPE_UNSPECIFIED = 0;

  // Self-registration (open mode).
  REGISTRATION_SOURCE_TYPE_SELF_SIGNUP = 1;

  // Registration with invite code.
  REGISTRATION_SOURCE_TYPE_INVITE = 2;

  // Admin created profile manually.
  REGISTRATION_SOURCE_TYPE_ADMIN_CREATED = 3;

  // SCIM provisioning.
  REGISTRATION_SOURCE_TYPE_SCIM_PROVISIONED = 4;

  // Federation (person linked to this org).
  REGISTRATION_SOURCE_TYPE_FEDERATION = 5;

  // Identity brokering (upstream IdP).
  REGISTRATION_SOURCE_TYPE_IDENTITY_BROKERED = 6;
}

// Invite status for filtering.
enum InviteStatus {
  INVITE_STATUS_UNSPECIFIED = 0;

  // Active and can be used.
  INVITE_STATUS_ACTIVE = 1;

  // All uses consumed (use_count >= max_uses).
  INVITE_STATUS_CONSUMED = 2;

  // Manually revoked by admin.
  INVITE_STATUS_REVOKED = 3;

  // Past expiration date.
  INVITE_STATUS_EXPIRED = 4;
}

// ══════════════════════════════════════════════════════════════════════════
// Enrollment Policy
// ══════════════════════════════════════════════════════════════════════════

// Enrollment (registration) policy — controls who can create profiles.
// Sub-policy of SecurityPolicy.
message EnrollmentPolicy {
  // Registration gating mode.
  EnrollmentMode mode = 1;

  // Invite configuration (only used when mode = INVITE_ONLY).
  InviteConfig invite = 2;

  // Allowed email domains (only used when mode = DOMAIN_RESTRICTED).
  // Example: ["acme.corp", "partner.org"]
  repeated string allowed_domains = 3;

  // Whether to track registration source metadata on profiles.
  // Default: true.
  bool track_source = 4;
}

// Configuration for the invite system.
message InviteConfig {
  // Default max uses for new invite codes. 1 = single-use.
  uint32 default_max_uses = 1;

  // Default expiration duration in hours. 0 = no expiry.
  uint32 default_expiry_hours = 2;
}

// ══════════════════════════════════════════════════════════════════════════
// Invite
// ══════════════════════════════════════════════════════════════════════════

// Invite code for gated registration.
message Invite {
  // Unique invite ID (UUID).
  string id = 1;

  // The code that the user enters during registration.
  // Cryptographically random, URL-safe, 8-character alphanumeric (case-insensitive).
  string code = 2;

  // Profile ID of the admin who created this invite.
  string created_by = 3;

  // Display name of the creator (for admin-ui).
  string created_by_name = 4;

  // Optional: pre-fill profile fields on registration.
  // Example: department, role, group membership.
  map<string, string> metadata = 5;

  // Maximum number of times this code can be used.
  // 1 = single-use (most common). 0 = unlimited.
  uint32 max_uses = 6;

  // How many times this code has been used.
  uint32 use_count = 7;

  // Expiration. Not set = no expiry.
  optional google.protobuf.Timestamp expires_at = 8;

  // Whether this invite is active.
  bool active = 9;

  // Computed status for display purposes.
  InviteStatus status = 10;

  google.protobuf.Timestamp created_at = 11;
}

// ══════════════════════════════════════════════════════════════════════════
// Registration Source
// ══════════════════════════════════════════════════════════════════════════

// How a profile was created. Stored as metadata on the profile.
message RegistrationSource {
  // Source type.
  RegistrationSourceType source_type = 1;

  // Raw source identifier.
  // invite:{code}, scim:{provider}, admin:{admin_profile_id},
  // federation:{idp_id}, self:{client_id}
  string source_id = 2;

  // Referrer profile ID (if provided during registration).
  optional string referrer_id = 3;

  // UTM parameters (if captured from registration URL).
  UtmParams utm = 4;

  // Client application through which registration occurred.
  optional string client_id = 5;

  google.protobuf.Timestamp created_at = 6;
}

// UTM tracking parameters from registration URL.
message UtmParams {
  string source = 1;     // utm_source
  string medium = 2;     // utm_medium
  string campaign = 3;   // utm_campaign
  string term = 4;       // utm_term
  string content = 5;    // utm_content
}

// ══════════════════════════════════════════════════════════════════════════
// Registration Statistics
// ══════════════════════════════════════════════════════════════════════════

// Aggregated registration statistics for admin dashboard.
message RegistrationStats {
  // Total new profiles in the period.
  uint32 total = 1;

  // Breakdown by source type.
  repeated SourceBreakdown by_source = 2;

  // Top referrers in the period.
  repeated ReferrerEntry top_referrers = 3;

  // Total referrals count.
  uint32 total_referrals = 4;

  // Number of unique referrers.
  uint32 unique_referrers = 5;
}

// Registration count for a single source type.
message SourceBreakdown {
  RegistrationSourceType source_type = 1;
  uint32 count = 2;
  // Percentage of total (0-100).
  double percentage = 3;
}

// A referrer and their referral count.
message ReferrerEntry {
  string profile_id = 1;
  string display_name = 2;
  uint32 referral_count = 3;
}

// ══════════════════════════════════════════════════════════════════════════
// Requests
// ══════════════════════════════════════════════════════════════════════════

message UpdateEnrollmentPolicyRequest {
  EnrollmentPolicy policy = 1;
}

message CreateInviteRequest {
  // Maximum number of times this code can be used. Default: 1.
  uint32 max_uses = 1;

  // Expiration timestamp. Not set = no expiry.
  optional google.protobuf.Timestamp expires_at = 2;

  // Optional metadata to pre-fill on registration.
  map<string, string> metadata = 3;
}

message ListInvitesRequest {
  // Pagination.
  uint32 page_size = 1;
  string page_token = 2;

  // Filter by status.
  InviteStatus status = 3;

  // Search by code or creator name.
  string search = 4;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
  string next_page_token = 2;
  uint32 total_count = 3;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message BulkCreateInvitesRequest {
  // Number of invite codes to generate.
  uint32 count = 1;

  // Max uses per code. Default: 1.
  uint32 max_uses = 2;

  // Expiration for all generated codes.
  optional google.protobuf.Timestamp expires_at = 3;

  // Metadata applied to all generated codes.
  map<string, string> metadata = 4;
}

message BulkCreateInvitesResponse {
  // Generated invite codes.
  repeated Invite invites = 1;
}

message GetRegistrationStatsRequest {
  // Period in days (7, 30, 90). Default: 30.
  uint32 period_days = 1;
}
