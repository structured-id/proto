// StructuredID Admin Session Service
// Global session management for admin console: listing, stats, revocation.
// Admin role required for all RPCs.
syntax = "proto3";

package sid.v1.admin;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// SessionService provides admin-level session management across all users.
// Per-user sessions are available via IdentityService.ListSessions.
service SessionService {
  // List all active sessions (paginated, filterable).
  rpc ListSessions(AdminListSessionsRequest) returns (AdminListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/sessions" };
  }

  // Get aggregated session statistics (total, by client, peak).
  rpc GetSessionStats(GetSessionStatsRequest) returns (SessionStats) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/sessions/stats" };
  }

  // Revoke an individual session.
  rpc RevokeSession(AdminRevokeSessionRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { delete: "/v1/admin/sessions/{session_id}" };
  }

  // Revoke all sessions for a specific application.
  rpc RevokeApplicationSessions(RevokeApplicationSessionsRequest) returns (RevokeSessionsResult) {
    option (google.api.http) = { post: "/v1/admin/sessions/revoke-by-app" body: "*" };
  }

  // Revoke ALL sessions in the realm (emergency).
  rpc RevokeRealmSessions(RevokeRealmSessionsRequest) returns (RevokeSessionsResult) {
    option (google.api.http) = { post: "/v1/admin/sessions/revoke-all" body: "*" };
  }
}

// ── Enums ──

enum SessionAuthMethod {
  SESSION_AUTH_METHOD_UNSPECIFIED = 0;
  SESSION_AUTH_METHOD_PASSWORD = 1;
  SESSION_AUTH_METHOD_MFA = 2;
  SESSION_AUTH_METHOD_SSO = 3;
  SESSION_AUTH_METHOD_PASSKEY = 4;
  SESSION_AUTH_METHOD_MAGIC_LINK = 5;
}

// ── Messages ──

message AdminSession {
  string session_id = 1;
  string profile_id = 2;
  string display_name = 3;
  string email = 4;
  // Application (client) that initiated the session.
  string client_id = 5;
  string client_name = 6;
  string ip_address = 7;
  string user_agent = 8;
  SessionAuthMethod auth_method = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp last_activity = 11;
}

message SessionStats {
  uint32 total_active = 1;
  uint32 active_users = 2;
  uint32 peak_today = 3;
  repeated ClientSessionCount by_client = 4;
}

message ClientSessionCount {
  string client_id = 1;
  string client_name = 2;
  uint32 active_sessions = 3;
  uint32 unique_users = 4;
}

message RevokeSessionsResult {
  uint32 revoked_count = 1;
}

// ── Requests ──

message AdminListSessionsRequest {
  // Pagination.
  uint32 page_size = 1;
  string page_token = 2;
  // Filters.
  string client_id = 3;
  string profile_id = 4;
  string ip_address = 5;
  SessionAuthMethod auth_method = 6;
  google.protobuf.Timestamp started_after = 7;
  google.protobuf.Timestamp started_before = 8;
  string search = 9;
}

message AdminListSessionsResponse {
  repeated AdminSession sessions = 1;
  string next_page_token = 2;
  uint32 total_count = 3;
}

message GetSessionStatsRequest {}

message AdminRevokeSessionRequest {
  string session_id = 1;
}

message RevokeApplicationSessionsRequest {
  string client_id = 1;
}

message RevokeRealmSessionsRequest {
  // Confirmation text — must be "REVOKE ALL SESSIONS" to proceed.
  string confirmation = 1;
}
