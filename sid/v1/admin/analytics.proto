// StructuredID Analytics Service
// Operational analytics: overview cards, time series, distribution.
// Admin access required.
syntax = "proto3";

package sid.v1.admin;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service AnalyticsService {
  // Overview sparkline cards (6 metrics with 24h trend).
  rpc GetOverviewMetrics(GetOverviewMetricsRequest) returns (OverviewMetricsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/analytics/overview" };
  }

  // Auth activity time series (stacked: success/failure/mfa).
  rpc GetAuthActivity(TimeSeriesRequest) returns (TimeSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/analytics/auth-activity" };
  }

  // Auth latency percentiles (p50/p95/p99).
  rpc GetAuthLatency(TimeSeriesRequest) returns (TimeSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/analytics/auth-latency" };
  }

  // Top applications by login count.
  rpc GetTopApplications(TopApplicationsRequest) returns (TopApplicationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/analytics/top-applications" };
  }

  // Auth method distribution (donut chart data).
  rpc GetAuthMethodDistribution(TimeSeriesRequest) returns (DistributionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/admin/analytics/auth-methods" };
  }
}

// ── Enums ──

enum AnalyticsPeriod {
  ANALYTICS_PERIOD_UNSPECIFIED = 0;
  ANALYTICS_PERIOD_24H = 1;
  ANALYTICS_PERIOD_7D = 2;
  ANALYTICS_PERIOD_30D = 3;
  ANALYTICS_PERIOD_90D = 4;
  ANALYTICS_PERIOD_CUSTOM = 5;
}

enum MetricTrend {
  METRIC_TREND_UNSPECIFIED = 0;
  METRIC_TREND_UP = 1;
  METRIC_TREND_DOWN = 2;
  METRIC_TREND_FLAT = 3;
}

// ── Overview Cards ──

message GetOverviewMetricsRequest {
  // Period for sparkline data and trend calculation.
  AnalyticsPeriod period = 1;
}

message MetricCard {
  string name = 1;
  string label = 2;
  // Current value (e.g., "12,847" or "3,412").
  double value = 3;
  // Suffix for display (e.g., "today", "now").
  string suffix = 4;
  // Trend percentage (positive = up, negative = down).
  double trend_percent = 5;
  MetricTrend trend = 6;
  // Sparkline data points (24h by default, one per hour).
  repeated double sparkline = 7;
}

message OverviewMetricsResponse {
  repeated MetricCard cards = 1;
}

// ── Time Series ──

message TimeSeriesRequest {
  AnalyticsPeriod period = 1;
  // For CUSTOM period.
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message TimeSeriesPoint {
  google.protobuf.Timestamp timestamp = 1;
  double value = 2;
}

message TimeSeries {
  string name = 1;
  string label = 2;
  string color = 3;
  // "solid", "dashed", "dotted"
  string line_style = 4;
  repeated TimeSeriesPoint points = 5;
}

message TimeSeriesResponse {
  repeated TimeSeries series = 1;
}

// ── Top Applications ──

message TopApplicationsRequest {
  AnalyticsPeriod period = 1;
  uint32 limit = 2;
}

message ApplicationMetric {
  string client_id = 1;
  string application_name = 2;
  uint64 login_count = 3;
}

message TopApplicationsResponse {
  repeated ApplicationMetric applications = 1;
}

// ── Distribution (donut/pie) ──

message DistributionSlice {
  string label = 1;
  double value = 2;
  // Percentage of total (0.0–100.0).
  double percentage = 3;
  string color = 4;
}

message DistributionResponse {
  repeated DistributionSlice slices = 1;
  double total = 2;
}
