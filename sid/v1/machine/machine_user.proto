// StructuredID Machine User Service
// Manages non-human identities (service accounts, bots, agents).
// Machine users authenticate via OAuth2 client credentials grant
// and support credential rotation, impersonation, and lifecycle management.
syntax = "proto3";

package sid.v1.machine;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "sid/v1/common/operation.proto";
import "sid/v1/ids/ids.proto";

// MachineUserService manages non-human identities (service accounts).
service MachineUserService {
  // CRUD
  rpc CreateMachineUser(CreateMachineUserRequest) returns (CreateMachineUserResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = { post: "/v1/machine-users" body: "*" };
  }
  rpc GetMachineUser(GetMachineUserRequest) returns (MachineUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/machine-users/{machine_user_id.value}" };
  }
  rpc UpdateMachineUser(UpdateMachineUserRequest) returns (MachineUserResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = {
      patch: "/v1/machine-users/{machine_user_id.value}"
      body: "*"
    };
  }
  rpc DeleteMachineUser(DeleteMachineUserRequest) returns (DeleteMachineUserResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = { delete: "/v1/machine-users/{machine_user_id.value}" };
  }
  rpc ListMachineUsers(ListMachineUsersRequest) returns (ListMachineUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/projects/{project_id.value}/machine-users" };
  }
  rpc SuspendMachineUser(SuspendMachineUserRequest) returns (MachineUserResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = {
      post: "/v1/machine-users/{machine_user_id.value}/suspend"
      body: "*"
    };
  }
  rpc ReactivateMachineUser(ReactivateMachineUserRequest) returns (MachineUserResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = {
      post: "/v1/machine-users/{machine_user_id.value}/reactivate"
      body: "*"
    };
  }

  // Credentials. A retry of an addition or rotation answers with the
  // credentials it left and an empty `client_secret`: the secret is shown
  // once and never stored in plaintext.
  rpc AddMachineCredential(AddMachineCredentialRequest) returns (AddMachineCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = {
      post: "/v1/machine-users/{machine_user_id.value}/credentials"
      body: "*"
    };
  }
  rpc RevokeMachineCredential(RevokeMachineCredentialRequest) returns (RevokeMachineCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = {
      natural: "a revoked credential is never reactivated: a repeat finds it revoked, answers as the first and stops its tokens again"
    };
    option (google.api.http) = {
      delete: "/v1/machine-users/{machine_user_id.value}/credentials/{kid}"
    };
  }
  rpc ListMachineCredentials(ListMachineCredentialsRequest) returns (ListMachineCredentialsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/machine-users/{machine_user_id.value}/credentials"
    };
  }
  rpc RotateMachineCredential(RotateMachineCredentialRequest) returns (RotateMachineCredentialResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = {
      post: "/v1/machine-users/{machine_user_id.value}/credentials/{kid}/rotate"
      body: "*"
    };
  }

  // Impersonation
  rpc GrantImpersonation(GrantImpersonationRequest) returns (GrantImpersonationResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = {
      post: "/v1/machine-users/{machine_user_id.value}/impersonation"
      body: "*"
    };
  }
  rpc RevokeImpersonation(RevokeImpersonationRequest) returns (RevokeImpersonationResponse) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.retry) = { keyed: true };
    option (google.api.http) = {
      delete: "/v1/machine-users/{machine_user_id.value}/impersonation/{target_type}/{target}"
    };
  }
  rpc ListImpersonationGrants(ListImpersonationGrantsRequest) returns (ListImpersonationGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/v1/machine-users/{machine_user_id.value}/impersonation"
    };
  }
}

// Enums
enum MachineUserType {
  MACHINE_USER_TYPE_UNSPECIFIED = 0;
  MACHINE_USER_TYPE_SERVICE = 1;
  MACHINE_USER_TYPE_BOT = 2;
  MACHINE_USER_TYPE_AGENT = 3;
}

enum MachineUserStatus {
  MACHINE_USER_STATUS_UNSPECIFIED = 0;
  MACHINE_USER_STATUS_ACTIVE = 1;
  MACHINE_USER_STATUS_SUSPENDED = 2;
  MACHINE_USER_STATUS_EXPIRED = 3;
  MACHINE_USER_STATUS_DELETED = 4;
}

enum MachineCredentialType {
  MACHINE_CREDENTIAL_TYPE_UNSPECIFIED = 0;
  MACHINE_CREDENTIAL_TYPE_CLIENT_SECRET = 1;
  MACHINE_CREDENTIAL_TYPE_PRIVATE_KEY_JWT = 2;
  MACHINE_CREDENTIAL_TYPE_MTLS = 3;
  MACHINE_CREDENTIAL_TYPE_WORKLOAD_IDENTITY = 4;
}

enum MachineCredentialStatus {
  MACHINE_CREDENTIAL_STATUS_UNSPECIFIED = 0;
  MACHINE_CREDENTIAL_STATUS_ACTIVE = 1;
  MACHINE_CREDENTIAL_STATUS_GRACE_PERIOD = 2;
  MACHINE_CREDENTIAL_STATUS_EXPIRED = 3;
  MACHINE_CREDENTIAL_STATUS_REVOKED = 4;
}

enum ImpersonationTargetType {
  IMPERSONATION_TARGET_TYPE_UNSPECIFIED = 0;
  IMPERSONATION_TARGET_TYPE_ROLE = 1;
  IMPERSONATION_TARGET_TYPE_USER = 2;
}

// Messages
message MachineUserInfo {
  sid.v1.ids.MachineUserId id = 1;
  sid.v1.ids.ProjectId project_id = 2;
  // The OAuth `client_id` (RFC 6749 §2.2) the machine user authenticates as.
  string client_id = 3;
  string display_name = 4;
  string description = 5;
  MachineUserType machine_type = 6;
  MachineUserStatus status = 7;
  // Who the machine user acts for.
  MachineUserOwner owner = 8;
  // Roles are RoleAssignments of the machine user principal (AuthzService),
  // never a list stored on the machine user.
  repeated string scopes = 9;
  repeated string ip_allowlist = 10;
  int32 rate_limit_rpm = 11;
  int32 max_token_lifetime = 12;
  google.protobuf.Timestamp expires_at = 13;
  google.protobuf.Timestamp last_used_at = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// Who a machine user acts for. Set at its creation and never changed.
message MachineUserOwner {
  oneof owner {
    // A Profile's own machine user.
    sid.v1.ids.ProfileId profile = 1;
    // An organization's machine user, created by its administrators.
    sid.v1.ids.OrgId organization = 2;
    // The installation's own, established by its provisioning only.
    google.protobuf.Empty system = 3;
  }
}

message MachineCredentialInfo {
  string kid = 1;
  MachineCredentialType credential_type = 2;
  MachineCredentialStatus status = 3;
  string algorithm = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
  // NOTE: credential_data is NEVER returned for client_secret type
}

message ImpersonationGrantInfo {
  string id = 1;
  sid.v1.ids.MachineUserId machine_user_id = 2;
  ImpersonationTargetType target_type = 3;
  string target = 4;
  repeated string allowed_scopes = 5;
  google.protobuf.Timestamp created_at = 6;
}

// -- CRUD messages --

message CreateMachineUserRequest {
  sid.v1.ids.ProjectId project_id = 1;
  string display_name = 2;
  string description = 3;
  MachineUserType machine_type = 4;
  // Roles are granted through AuthzService.AssignRole.
  repeated string scopes = 5;
  repeated string ip_allowlist = 6;
  int32 rate_limit_rpm = 7;
  int32 max_token_lifetime = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message CreateMachineUserResponse {
  MachineUserInfo machine_user = 1;
}

message GetMachineUserRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
}

message MachineUserResponse {
  MachineUserInfo machine_user = 1;
}

message UpdateMachineUserRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
  string display_name = 2;
  string description = 3;
  // Roles are granted through AuthzService.AssignRole.
  repeated string scopes = 4;
  repeated string ip_allowlist = 5;
  int32 rate_limit_rpm = 6;
  int32 max_token_lifetime = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message DeleteMachineUserRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
}

message DeleteMachineUserResponse {}

message ListMachineUsersRequest {
  sid.v1.ids.ProjectId project_id = 1;
}

message ListMachineUsersResponse {
  repeated MachineUserInfo machine_users = 1;
}

message SuspendMachineUserRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
}

message ReactivateMachineUserRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
}

// -- Credential messages --

message AddMachineCredentialRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
  MachineCredentialType credential_type = 2;
  // For private_key_jwt: the JWS algorithm (RFC 7518 §3.1), e.g. "ES256".
  string algorithm = 3;
  // For private_key_jwt: the public key, a DER-encoded SubjectPublicKeyInfo
  // (RFC 5280 §4.1.2.7). Its private key never reaches SID.
  bytes public_key = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message AddMachineCredentialResponse {
  MachineCredentialInfo credential = 1;
  string client_secret = 2;      // Plaintext — shown ONCE for client_secret type. Empty for others.
}

message RevokeMachineCredentialRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
  string kid = 2;
}

message RevokeMachineCredentialResponse {}

message ListMachineCredentialsRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
}

message ListMachineCredentialsResponse {
  repeated MachineCredentialInfo credentials = 1;
}

message RotateMachineCredentialRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
  // Key ID of the credential to rotate.
  string kid = 2;
  // For a new private_key_jwt credential: as AddMachineCredentialRequest.
  string algorithm = 3;
  bytes public_key = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message RotateMachineCredentialResponse {
  MachineCredentialInfo old_credential = 1;  // Set to grace_period
  MachineCredentialInfo new_credential = 2;
  string client_secret = 3;           // If client_secret type
}

// -- Impersonation messages --

message GrantImpersonationRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
  ImpersonationTargetType target_type = 2;
  string target = 3;
  repeated string allowed_scopes = 4;
}

message GrantImpersonationResponse {
  ImpersonationGrantInfo grant = 1;
}

message RevokeImpersonationRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
  string target_type = 2;
  string target = 3;
}

message RevokeImpersonationResponse {}

message ListImpersonationGrantsRequest {
  sid.v1.ids.MachineUserId machine_user_id = 1;
}

message ListImpersonationGrantsResponse {
  repeated ImpersonationGrantInfo grants = 1;
}
