syntax = "proto3";

// StructuredID identifiers in their binary wire form. Each identifier kind is
// its own message, so values of different kinds are different types in every
// generated language even though their bytes have the same shape. Text forms
// (hyphenated UUID) are for display in SDKs and clients only.
//
// This file imports nothing, so a consumer can compile it on its own.
package sid.v1.ids;

// A user's Profile within one installation. Internal to that installation:
// an external or federated service never receives it and sees a pairwise
// BindingId instead.
message ProfileId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One login handle of a Profile (an email, phone or username it signs in
// with): the reference its management names. Not the handle's value.
message PrincipalId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One email address recorded for a Profile, a contact that may or may not
// be a login handle: the reference its management names.
message ProfileEmailId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One phone number recorded for a Profile, a contact that may or may not be
// a login handle: the reference its management names.
message ProfilePhoneId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// A device registered in a Profile's scope: a descriptive record its
// management and sessions name. Knowing it grants no authority and proves
// no possession of a device key.
message DeviceId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// A Profile's identity at one organization: the pairwise subject that
// organization's services see. Opaque and unlinkable across organizations;
// it never carries or reveals a ProfileId.
message BindingId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// An organization, fixed at its creation: the authority its members, roles
// and applications belong to, and the key of its pairwise subjects.
message OrgId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// A logical OIDC issuer: one issuing authority for one recipient
// organization. Internal; its public URL names it by an opaque handle.
message IssuerId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// A managed application: the container of an OAuth client role, a protected
// resource role, or both. Not the OAuth client_id, which is its own text.
message ApplicationId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One password-installing operation (a registration, change or authorized
// reset) from its preparation to its commit. Every step and retry of the
// operation carries it, so a lost response resolves to the operation's one
// outcome instead of starting another.
message PasswordOperationId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One OPAQUE login (RFC 9807 §6) from its start to its finish: the reference
// to the login state the server keeps between the two steps. It carries no
// part of that state; the server's AKE state never leaves it.
message OpaqueLoginId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// An authenticated session of a Profile: the reference session management
// (listing, revocation, sign-out) names. Not a credential; holding it
// authorizes nothing.
message SessionId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One authentication credential of a Profile (a password, passkey, TOTP or
// recovery code set): the reference management and change operations name.
// Never the secret or the WebAuthn credential ID of the authenticator.
message CredentialId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One emailed one-time code from its request to its verification: the
// reference verify and resend carry. It carries no part of the code.
message OtpSessionId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One magic link from its request to its verification: the reference the
// link carries beside its secret token. It authorizes nothing without that
// token.
message MagicLinkId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One two-phase step-up of a session (a WebAuthn assertion) from its
// challenge to its completion: the reference to the challenge the server
// keeps for that session only.
message StepUpChallengeId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One password reset from its emailed link to its completion: the reference
// the link carries beside its secret token. It authorizes nothing without
// that token.
message ResetSessionId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One upgrade of an imported password to OPAQUE from its start to its
// finish: the reference to the upgrade state the server keeps between the
// two steps. It carries no part of that state.
message ImportedPasswordUpgradeId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// A non-human actor (a service, bot or agent) with its own SID credentials.
// Not a Binding, a Profile or a device, whatever its bytes.
message MachineUserId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// A provisioning connector: one directory source sending SCIM to an
// organization, or one target the organization provisions, acting as its own
// actor with its own credentials and grants. Not a machine user or a Profile.
message ProvisioningConnectorId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// A registered protected resource: the application or API at which access is
// enforced, in its issuer's context. Not an OAuth client and not an audience
// string; its indicator and issuer come from its registration.
message ResourceId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}

// One credential of a provisioning connector: the reference listings,
// rotations, revocations and audit records name. Never the secret itself.
message ProvisioningCredentialId {
  // Exactly 16 bytes: an RFC 9562 UUID of version 7 and the RFC 9562 variant,
  // in network byte order. Nil, max, other lengths, versions and variants are
  // invalid. Issued by SID; compared by exact byte equality.
  bytes value = 1;
}
