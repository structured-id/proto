// The issuer's sign-in a user can choose for one authorization request: what
// the authorization endpoint accepts and what an application's browser
// adapter passes on from its own sign-in start.

syntax = "proto3";

package sid.v1.authn;

// The issuer's sign-in a user can choose for one authorization request.
enum SignInEntry {
  // The issuer's ordinary sign-in for the client: its own ceremony, or the
  // authority it trusts, as its installation decides.
  SIGN_IN_ENTRY_UNSPECIFIED = 0;
  // The sign-in through the authority the issuer trusts, for a user who
  // holds an account there and no login the issuer assigned.
  SIGN_IN_ENTRY_AUTHORITY = 1;
}
