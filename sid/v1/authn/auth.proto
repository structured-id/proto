// StructuredID Authentication Service
// Handles authentication flows (OPAQUE, OAuth2, WebAuthn).
syntax = "proto3";

package sid.v1.authn;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

// AuthService handles authentication flows.
service AuthService {
  // OPAQUE password authentication (RFC 9807).
  rpc OpaqueRegistrationStart(OpaqueRegistrationStartRequest) returns (OpaqueRegistrationStartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/opaque/registration/start" body: "*" };
  }
  rpc OpaqueRegistrationFinish(OpaqueRegistrationFinishRequest) returns (OpaqueRegistrationFinishResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/auth/opaque/registration/finish" body: "*" };
  }
  rpc OpaqueLoginStart(OpaqueLoginStartRequest) returns (OpaqueLoginStartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/opaque/login/start" body: "*" };
  }
  rpc OpaqueLoginFinish(OpaqueLoginFinishRequest) returns (OpaqueLoginFinishResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/auth/opaque/login/finish" body: "*" };
  }

  // OPAQUE-ZKPP: OPAQUE with zero-knowledge password policy proof (Pallas curve).
  rpc OpaqueZkppRegistrationStart(OpaqueZkppRegistrationStartRequest) returns (OpaqueZkppRegistrationStartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/opaque-zkpp/registration/start" body: "*" };
  }
  rpc OpaqueZkppRegistrationFinish(OpaqueZkppRegistrationFinishRequest) returns (OpaqueZkppRegistrationFinishResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/auth/opaque-zkpp/registration/finish" body: "*" };
  }
  rpc PasswordChangeChallenge(PasswordChangeChallengeRequest) returns (PasswordChangeChallengeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/password/change/challenge" body: "*" };
  }
  rpc PasswordChangeExecute(PasswordChangeExecuteRequest) returns (PasswordChangeExecuteResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/auth/password/change/execute" body: "*" };
  }
  rpc PasswordChangeFinish(PasswordChangeFinishRequest) returns (PasswordChangeFinishResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/auth/password/change/finish" body: "*" };
  }

  // WebAuthn (passkeys).
  rpc WebAuthnRegistrationStart(WebAuthnRegistrationStartRequest) returns (WebAuthnRegistrationStartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/webauthn/registration/start" body: "*" };
  }
  rpc WebAuthnRegistrationFinish(WebAuthnRegistrationFinishRequest) returns (WebAuthnRegistrationFinishResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/auth/webauthn/registration/finish" body: "*" };
  }
  rpc WebAuthnAuthenticationStart(WebAuthnAuthenticationStartRequest) returns (WebAuthnAuthenticationStartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/webauthn/authentication/start" body: "*" };
  }
  rpc WebAuthnAuthenticationFinish(WebAuthnAuthenticationFinishRequest) returns (WebAuthnAuthenticationFinishResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/auth/webauthn/authentication/finish" body: "*" };
  }

  // OAuth2 / OIDC flows.
  rpc OAuth2Authorize(OAuth2AuthorizeRequest) returns (OAuth2AuthorizeResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/oauth2/authorize" body: "*" };
  }
  rpc OAuth2Token(OAuth2TokenRequest) returns (OAuth2TokenResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/oauth2/token" body: "*" };
  }
  rpc OAuth2Introspect(OAuth2IntrospectRequest) returns (OAuth2IntrospectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/oauth2/introspect" body: "*" };
  }
  rpc OAuth2Revoke(OAuth2RevokeRequest) returns (OAuth2RevokeResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/oauth2/revoke" body: "*" };
  }

  // Device Authorization Grant (RFC 8628).
  rpc StartDeviceAuthorization(DeviceAuthorizationRequest) returns (DeviceAuthorizationResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/oauth2/device" body: "*" };
  }
  rpc PollDeviceToken(PollDeviceTokenRequest) returns (OAuth2TokenResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/oauth2/device/token" body: "*" };
  }
  rpc SubmitDeviceUserCode(SubmitDeviceUserCodeRequest) returns (SubmitDeviceUserCodeResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/oauth2/device/submit" body: "*" };
  }

  // ── Magic Link (passwordless, corporate profiles) ──

  rpc RequestMagicLink(RequestMagicLinkRequest) returns (RequestMagicLinkResponse) {
    option (google.api.http) = { post: "/v1/auth/magic-link/request" body: "*" };
  }

  rpc VerifyMagicLink(VerifyMagicLinkRequest) returns (VerifyMagicLinkResponse) {
    option (google.api.http) = { post: "/v1/auth/magic-link/verify" body: "*" };
  }

  // Legacy password migration (on-login OPAQUE re-registration).
  rpc LegacyMigrateStart(LegacyMigrateStartRequest) returns (LegacyMigrateStartResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/legacy/migrate/start" body: "*" };
  }
  rpc LegacyMigrateFinish(LegacyMigrateFinishRequest) returns (LegacyMigrateFinishResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/auth/legacy/migrate/finish" body: "*" };
  }

  // Session validation.
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/sessions/validate" body: "*" };
  }

  // Unified login flow: resolve principal → available auth methods.
  rpc ResolvePrincipal(ResolvePrincipalRequest) returns (ResolvePrincipalResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { post: "/v1/auth/resolve" body: "*" };
  }

  // ZKPP password policy: current policy version and parameters.
  rpc GetZkppPolicy(GetZkppPolicyRequest) returns (GetZkppPolicyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/auth/opaque-zkpp/policy" };
  }

  // Submit a deferred ZK proof for a credential registered without WASM.
  // Must be called within 24h of registration from a WASM-capable device.
  rpc SubmitDeferredZkProof(SubmitDeferredZkProofRequest) returns (SubmitDeferredZkProofResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/auth/zk-proof/deferred" body: "*" };
  }

  // ── MFA TOTP ──

  rpc StartTotpEnrollment(StartTotpEnrollmentRequest) returns (TotpEnrollmentChallenge) {
    option (google.api.http) = { post: "/v1/auth/mfa/totp/enroll/start" body: "*" };
  }
  rpc FinishTotpEnrollment(FinishTotpEnrollmentRequest) returns (FinishTotpEnrollmentResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/auth/mfa/totp/enroll/finish" body: "*" };
  }
  rpc VerifyTotp(VerifyTotpRequest) returns (MfaVerifyResponse) {
    option (google.api.http) = { post: "/v1/auth/mfa/totp/verify" body: "*" };
  }

  // ── MFA SMS ──

  rpc VerifySmsMfa(VerifySmsMfaRequest) returns (MfaVerifyResponse) {
    option (google.api.http) = { post: "/v1/auth/mfa/sms/verify" body: "*" };
  }
  rpc ResendSmsMfa(ResendSmsMfaRequest) returns (ResendSmsMfaResponse) {
    option (google.api.http) = { post: "/v1/auth/mfa/sms/resend" body: "*" };
  }

  // ── MFA Recovery Codes ──

  rpc GenerateRecoveryCodes(GenerateRecoveryCodesRequest) returns (GenerateRecoveryCodesResponse) {
    option (google.api.http) = { post: "/v1/auth/mfa/recovery/generate" body: "*" };
  }
  rpc VerifyRecoveryCode(VerifyRecoveryCodeRequest) returns (MfaVerifyResponse) {
    option (google.api.http) = { post: "/v1/auth/mfa/recovery/verify" body: "*" };
  }

  // ── OTP verification (email/phone, non-MFA) ──

  rpc RequestOtp(RequestOtpRequest) returns (RequestOtpResponse) {
    option (google.api.http) = { post: "/v1/auth/otp/request" body: "*" };
  }
  rpc VerifyOtp(VerifyOtpRequest) returns (VerifyOtpResponse) {
    option (google.api.http) = { post: "/v1/auth/otp/verify" body: "*" };
  }
  rpc ResendOtp(ResendOtpRequest) returns (ResendOtpResponse) {
    option (google.api.http) = { post: "/v1/auth/otp/resend" body: "*" };
  }

  // ── Email/Phone verification ──

  rpc ResendEmailVerification(ResendEmailVerificationRequest) returns (ResendEmailVerificationResponse) {
    option (google.api.http) = { post: "/v1/auth/email/verify/resend" body: "*" };
  }
  rpc VerifyPhone(VerifyPhoneRequest) returns (VerifyPhoneResponse) {
    option (google.api.http) = { post: "/v1/auth/phone/verify" body: "*" };
  }
  rpc ResendPhoneVerification(ResendPhoneVerificationRequest) returns (ResendPhoneVerificationResponse) {
    option (google.api.http) = { post: "/v1/auth/phone/verify/resend" body: "*" };
  }

  // ── IdP linking ──

  rpc ConfirmIdpLink(ConfirmIdpLinkRequest) returns (ConfirmIdpLinkResponse) {
    option (google.api.http) = { post: "/v1/auth/idp/link/confirm" body: "*" };
  }

  // ── Organization selector (multi-org login) ──

  rpc ListUserOrganizations(ListUserOrganizationsRequest) returns (ListUserOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/auth/orgs" };
  }
  rpc SelectOrganization(SelectOrganizationRequest) returns (SelectOrganizationResponse) {
    option (google.api.http) = { post: "/v1/auth/orgs/select" body: "*" };
  }

  // ── Terms acceptance ──

  rpc GetTerms(GetTermsRequest) returns (GetTermsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/auth/terms" };
  }
  rpc AcceptTerms(AcceptTermsRequest) returns (AcceptTermsResponse) {
    option (google.api.http) = { post: "/v1/auth/terms/accept" body: "*" };
  }

  // ── CIBA consent (EE) ──

  rpc ApproveCiba(ApproveCibaRequest) returns (CibaConsentResponse) {
    option (google.api.http) = { post: "/v1/auth/ciba/approve" body: "*" };
  }
  rpc DenyCiba(DenyCibaRequest) returns (CibaConsentResponse) {
    option (google.api.http) = { post: "/v1/auth/ciba/deny" body: "*" };
  }

  // ── Captcha ──

  rpc VerifyCaptcha(VerifyCaptchaRequest) returns (VerifyCaptchaResponse) {
    option (google.api.http) = { post: "/v1/auth/captcha/verify" body: "*" };
  }

  // ── Dynamic prompt (EE custom auth steps) ──

  rpc GetDynamicPrompt(GetDynamicPromptRequest) returns (DynamicPrompt) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/auth/prompt/{prompt_id}" };
  }
  rpc SubmitDynamicPrompt(SubmitDynamicPromptRequest) returns (SubmitDynamicPromptResponse) {
    option (google.api.http) = { post: "/v1/auth/prompt/{prompt_id}/submit" body: "*" };
  }

  // ── Step-up authentication ──

  // Generic step-up Phase 1: request challenge (WebAuthn). Skip for TOTP/recovery.
  rpc RequestStepUp(RequestStepUpRequest) returns (StepUpChallenge) {
    option (google.api.http) = { post: "/v1/auth/step-up/request" body: "*" };
  }

  // Generic step-up Phase 2: submit proof → elevate session → rotate token.
  rpc CompleteStepUp(CompleteStepUpRequest) returns (CompleteStepUpResponse) {
    option (google.api.http) = { post: "/v1/auth/step-up/complete" body: "*" };
  }

  // ── MFA credential management ──

  // Delete an MFA credential (TOTP, WebAuthn, Recovery).
  // Requires elevated session (step-up auth) before calling.
  rpc DeleteMfaCredential(DeleteMfaCredentialRequest) returns (DeleteMfaCredentialResponse) {
    option (google.api.http) = { delete: "/v1/auth/mfa/credentials/{credential_id}" };
  }

  // ── Account deletion confirmation ──

  rpc ConfirmAccountDeletion(ConfirmAccountDeletionRequest) returns (ConfirmAccountDeletionResponse) {
    option (google.api.http) = { post: "/v1/auth/delete-confirm" body: "*" };
  }

  // Password reset flow (magic link → new OPAQUE credential).
  // SaaS extends this with key recovery (Shamir shards, DownloadRecoveryShard) in proto-ee.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse) {
    option (google.api.http) = { post: "/v1/auth/password/reset/request" body: "*" };
  }
  rpc VerifyPasswordReset(VerifyPasswordResetRequest) returns (VerifyPasswordResetResponse) {
    option (google.api.http) = { post: "/v1/auth/password/reset/verify" body: "*" };
  }
  rpc CompletePasswordReset(CompletePasswordResetRequest) returns (CompletePasswordResetResponse) {
    option (google.api.http) = { post: "/v1/auth/password/reset/complete" body: "*" };
  }
}

// ══════════════════════════════════════════════════════════════════════════
// OPAQUE registration flow (RFC 9807, 2-step).
//
// Step 1 (Start): Client blinds password → server evaluates OPRF.
// Step 2 (Finish): Client computes registration record → server stores credential.
// Password NEVER leaves the client device. Safe over TLS or even plaintext channel.
// ══════════════════════════════════════════════════════════════════════════

message OpaqueRegistrationStartRequest {
  // User-provided login identifier: email address, phone in E.164 format (+380...),
  // or username. Server resolves principal type from the value and looks up or creates
  // the profile. CE/EE: resolves to Profile. SaaS: may trigger Person creation.
  string principal = 1;
  // OPAQUE RegistrationRequest (blinded password). Client-generated by
  // OpaqueClient.registrationStart(password). Contains no recoverable password
  // material — safe to transmit. RFC 9807 §5.2.
  bytes registration_request = 2;
}

message OpaqueRegistrationStartResponse {
  // OPAQUE RegistrationResponse: server's OPRF evaluation of the blinded password.
  // Client needs this to compute the final registration record. RFC 9807 §5.2.
  // Server-generated, single-use.
  bytes registration_response = 1;
  // Serialized server-side OPAQUE setup state. Client echoes this back in Finish
  // to allow stateless server (no server-side session between Start and Finish).
  // Contains server's long-term public key + OPRF seed. Opaque to client.
  string server_setup = 2;
}

message OpaqueRegistrationFinishRequest {
  // Same principal as in Start. Server re-resolves to verify consistency.
  string principal = 1;
  // OPAQUE RegistrationRecord: client's encrypted credential envelope.
  // Contains the password file that server stores for future login verification.
  // Client-generated by OpaqueClient.registrationFinish(password, response, state).
  // Safe to transmit — encrypted under server's public key. RFC 9807 §5.2.
  bytes registration_record = 2;
  // Echoed from OpaqueRegistrationStartResponse.server_setup.
  // Server deserializes to recover OPRF context for storing the credential.
  string server_setup = 3;
}

message OpaqueRegistrationFinishResponse {
  // UUID of the newly created profile. Client stores for subsequent API calls.
  string profile_id = 1;
  // UUID of the OPAQUE credential stored on server. Used for password change
  // (PasswordChangeChallenge.credential_id) and credential management.
  string credential_id = 2;
}

// ══════════════════════════════════════════════════════════════════════════
// OPAQUE login flow (RFC 9807, 2-step).
//
// Step 1 (Start): Client generates credential request → server responds with
//   credential response containing encrypted envelope.
// Step 2 (Finish): Client decrypts envelope using password, generates finalization
//   → server verifies and issues session + JWT.
// AKE (Authenticated Key Exchange) establishes shared session key.
// ══════════════════════════════════════════════════════════════════════════

message OpaqueLoginStartRequest {
  // User-provided login identifier. Server looks up the OPAQUE credential
  // associated with this principal. If not found, server returns a fake
  // response (timing-safe, anti-enumeration). CE/EE: resolves to Profile.
  // SaaS: may resolve to Person (profile picker shown after auth).
  string principal = 1;
  // OPAQUE CredentialRequest (KE1): client's blinded password hash + ephemeral
  // DH public key. Client-generated by OpaqueClient.loginStart(password).
  // Contains no recoverable password material. RFC 9807 §6.
  bytes credential_request = 2;
}

message OpaqueLoginStartResponse {
  // OPAQUE CredentialResponse (KE2): server's encrypted credential envelope +
  // ephemeral DH public key + MAC. Client uses this to recover the password
  // file and compute the session key. RFC 9807 §6.
  bytes credential_response = 1;
  // Serialized ServerLogin state. Client echoes this in Finish for stateless
  // server design. Contains the server's AKE state machine (ephemeral keys,
  // expected finalization). 5-minute TTL.
  string server_login_state = 2;
}

message OpaqueLoginFinishRequest {
  // Same principal as in Start. Server re-resolves for session creation.
  string principal = 1;
  // OPAQUE CredentialFinalization (KE3): client's proof that it recovered
  // the correct password. Client-generated by OpaqueClient.loginFinish().
  // If password was wrong, client-side loginFinish fails (never reaches server).
  // RFC 9807 §6.
  bytes credential_finalization = 2;
  // Echoed from OpaqueLoginStartResponse.server_login_state.
  string server_login_state = 3;
}

message OpaqueLoginFinishResponse {
  // Server-assigned session identifier (UUIDv7). Used for session management
  // (revoke, step-up target), stored in auth store on client.
  string session_id = 1;
  // Short-lived JWT access token. Contains: sub (profile ID or pairwise hash),
  // pid (profile UUID), sid (session ID), iss, aud, exp, iat, scope, amr, acr.
  // Default lifetime: 15 minutes. Use OAuth2Token refresh_token for renewal.
  string access_token = 2;
  // Token lifetime in seconds. Client uses this to schedule refresh.
  // Server-configured per application (default 900 = 15 min).
  int64 expires_in = 3;
}

// ══════════════════════════════════════════════════════════════════════════
// OPAQUE-ZKPP registration flow (2-step with zero-knowledge password policy proof).
//
// Extends OPAQUE registration with a Halo2 ZK proof that the password meets
// the server's policy (min length, character classes) WITHOUT revealing the password.
// Uses Pallas curve (from Pasta family) for both OPAQUE and ZK circuits.
//
// Graceful degradation: if client lacks WASM capability, zkpp_proof is empty.
// Server sets zkpp_verified=false and starts a 24h deferred verification window
// (see SubmitDeferredZkProof RPC).
//
// Reference: Prudnikov, D. (2026). "Zero-Knowledge Proof System for Password Policy
// Verification in Asymmetric Password-Authenticated Key Exchange."
// doi:10.5281/zenodo.19387561 — https://doi.org/10.5281/zenodo.19387561
// ══════════════════════════════════════════════════════════════════════════

message OpaqueZkppRegistrationStartRequest {
  // User-provided login identifier (same semantics as OpaqueRegistrationStartRequest.principal).
  string principal = 1;
  // OPAQUE RegistrationRequest on Pallas curve. Client-generated by WASM module.
  // Same semantics as basic OPAQUE but uses Pallas-based cipher suite.
  bytes registration_request = 2;
  // Halo2 zero-knowledge proof that the password satisfies the server's policy.
  // Client-generated by WASM module. Proves: min_length, character class counts,
  // and password history (not reusing recent passwords) — all without revealing
  // the password itself. Empty if WASM not available (graceful degradation).
  bytes zkpp_proof = 3;
  // 5 public instance values for the ZK proof verifier (32 bytes each, Pallas scalar field).
  // Encoding: [min_length, char_classes_packed, history_commitment, new_commitment, policy_version].
  // Client-generated alongside zkpp_proof. Empty if no proof.
  repeated bytes instances = 4;
  // Password policy version the proof was generated against. Server compares with
  // its current version — if mismatch, returns error (client must re-fetch policy
  // via GetZkppPolicy and regenerate proof). Version negotiation, not derivable.
  uint32 policy_version = 5;
}

message OpaqueZkppRegistrationStartResponse {
  // OPAQUE RegistrationResponse on Pallas curve (same role as basic OPAQUE response).
  bytes registration_response = 1;
  // Whether the ZK proof was successfully verified. If false, server starts
  // 24h deferred verification window. Client echoes this in Finish request
  // so server knows whether to set credential.zkpp_verified = true/false.
  bool zkpp_verified = 2;
}

message OpaqueZkppRegistrationFinishRequest {
  // Same principal as in Start.
  string principal = 1;
  // OPAQUE RegistrationRecord on Pallas curve (same role as basic OPAQUE record).
  bytes registration_record = 2;
  // Poseidon hash H(password, salt) — stored server-side for password history.
  // Used during future password changes to prove new password differs from old.
  // Client-computed by WASM module. 32 bytes.
  bytes history_commitment = 3;
  // Random 32-byte salt used in history_commitment. Client-generated.
  // Stored alongside commitment for future verification.
  bytes commitment_salt = 4;
  // Echoed from OpaqueZkppRegistrationStartResponse.zkpp_verified.
  // Server validates consistency with its own record.
  bool zkpp_verified = 5;
}

message OpaqueZkppRegistrationFinishResponse {
  // UUID of the newly created profile.
  string profile_id = 1;
  // UUID of the OPAQUE-ZKPP credential stored on server.
  string credential_id = 2;
}

// Password change flow (3-step: challenge → execute → finish).
// Profile is resolved from the Bearer token (session subject) — not client-provided.
// credential_id selects which OPAQUE credential to change (profile may have multiple curves).

message PasswordChangeChallengeRequest {
  // Which OPAQUE credential to change. Required because a profile may have
  // multiple OPAQUE credentials (different curves: Ristretto255, P-256).
  // Client obtains this from ListCredentials filtered by type=OPAQUE.
  // Profile resolved from Bearer token (not client-provided).
  string credential_id = 1;
}

message PasswordChangeChallengeResponse {
  // Server-stored Poseidon hash H(old_password, salt). Client uses this to
  // generate ZK proof that the new password differs from the old one.
  bytes history_commitment = 1;
  // Server-stored salt used in history_commitment computation.
  bytes commitment_salt = 2;
  // Current password policy version. Client must generate ZKPP proof
  // against this version. If policy updated since last login, client
  // re-fetches via GetZkppPolicy and regenerates proof.
  uint32 policy_version = 3;
}

message PasswordChangeExecuteRequest {
  // Target OPAQUE credential (same as in ChallengeRequest).
  string credential_id = 1;
  // Halo2 ZK proof that the new password satisfies the policy AND differs
  // from the old password (verified against history_commitment).
  // Client-generated by WASM module. Optional if ZKPP not available (graceful degradation).
  bytes zkpp_proof = 3;
  // 5 public instance values for the ZK proof verifier (32 bytes each, Pallas base field).
  // Encoding: [min_length, char_classes_packed, history_commitment, new_commitment, policy_version].
  repeated bytes instances = 4;
  // New OPAQUE RegistrationRequest (Pallas curve). Client-side blinded password hash
  // for the new password. Generated by OpaqueClient.registrationStart(newPassword).
  bytes registration_request = 5;
  // Poseidon H(new_password, new_salt) — stored server-side for future password change
  // history checks (prevents reuse of recent passwords).
  bytes new_history_commitment = 6;
  // Random 32-byte salt for new_history_commitment. Client-generated.
  bytes new_commitment_salt = 7;
}

message PasswordChangeExecuteResponse {
  // Server's OPAQUE RegistrationResponse for the new password. Client uses this
  // to compute the final RegistrationRecord in the Finish step.
  bytes registration_response = 1;
}

message PasswordChangeFinishRequest {
  // Target OPAQUE credential (same as in Challenge/Execute).
  string credential_id = 1;
  // Final OPAQUE RegistrationRecord computed by client from RegistrationResponse.
  // Contains the encrypted password envelope that the server stores.
  // Generated by OpaqueClient.registrationFinish(newPassword, registrationResponse, state).
  bytes registration_record = 3;
}

message PasswordChangeFinishResponse {}

// WebAuthn registration flow (2-step).
// Profile is resolved from the Bearer token (session subject) — not client-provided.
// Self-service: user registers passkeys on their own profile.
// Admin registration of passkeys for other users = separate admin RPC (future).

message WebAuthnRegistrationStartRequest {
  // User-provided label for the authenticator (e.g., "iPhone 15 Pro", "YubiKey 5C").
  // Displayed in credential management UI. Optional — server generates default from UA.
  // Profile resolved from Bearer token (not client-provided).
  optional string label = 1;
}

message WebAuthnRegistrationStartResponse {
  // WebAuthn challenge bytes. Server stores in ephemeral cache (keyed by challenge value).
  // Client passes this to navigator.credentials.create() via options.
  bytes challenge = 1;
  // PublicKeyCredentialCreationOptions serialized as JSON.
  // Contains: rp (relying party), user (profile info), pubKeyCredParams,
  // excludeCredentials (existing passkeys), authenticatorSelection, attestation.
  bytes options = 2;
}

message WebAuthnRegistrationFinishRequest {
  // PublicKeyCredential JSON from navigator.credentials.create().
  // Contains: id, rawId, response (attestationObject + clientDataJSON), type.
  bytes credential = 1;
  // User-provided label (may differ from Start if user updated during registration).
  optional string label = 2;
}

message WebAuthnRegistrationFinishResponse {
  // Server-assigned credential ID (UUID). Used for management (delete, update label).
  string credential_id = 1;
}

// ══════════════════════════════════════════════════════════════════════════
// WebAuthn authentication flow (2-step, WebAuthn Level 2).
//
// Supports two modes:
// 1. Principal-first: user enters email/phone → server returns allowCredentials
//    filtered to that user's registered passkeys.
// 2. Conditional UI / discoverable: no principal → browser shows all available
//    passkeys (autofill, "Sign in with passkey" prompt). Server identifies user
//    from the authenticator's userHandle in the assertion.
// ══════════════════════════════════════════════════════════════════════════

message WebAuthnAuthenticationStartRequest {
  // User-provided login identifier for principal-first flow. When present,
  // server returns allowCredentials filtered to this user's passkeys.
  // When absent, conditional UI mode: browser shows all available credentials.
  // CE/EE: resolves to Profile. SaaS: may resolve to Person.
  optional string principal = 1;
}

message WebAuthnAuthenticationStartResponse {
  // WebAuthn challenge bytes for the assertion. Server stores in ephemeral cache.
  bytes challenge = 1;
  // PublicKeyCredentialRequestOptions serialized as JSON. Contains: challenge,
  // rpId, allowCredentials (populated for principal-first, empty for conditional UI),
  // userVerification, timeout.
  bytes options = 2;
  // Opaque state key for challenge lookup in Finish. Client echoes back.
  // Required for conditional UI (no principal to re-resolve).
  // Optional for principal-first (server can re-resolve, but state_key is faster).
  string state_key = 3;
}

message WebAuthnAuthenticationFinishRequest {
  // Same principal as in Start (principal-first) or absent (conditional UI).
  // Server uses principal OR authenticator userHandle to identify the profile.
  optional string principal = 1;
  // AuthenticatorAssertionResponse serialized as JSON from navigator.credentials.get().
  // Contains: id, rawId, response (authenticatorData + clientDataJSON + signature), type.
  bytes credential = 2;
  // Echoed from WebAuthnAuthenticationStartResponse.state_key.
  // Required for conditional UI. Optional for principal-first (backward compat).
  optional string state_key = 3;
}

message WebAuthnAuthenticationFinishResponse {
  // Server-assigned session ID (same semantics as OpaqueLoginFinishResponse).
  string session_id = 1;
  // Short-lived JWT access token (same semantics as OpaqueLoginFinishResponse).
  string access_token = 2;
  // Token lifetime in seconds.
  int64 expires_in = 3;
}

// ══════════════════════════════════════════════════════════════════════════
// OAuth2 / OIDC flows (RFC 6749, OpenID Connect Core 1.0).
// ══════════════════════════════════════════════════════════════════════════

message OAuth2AuthorizeRequest {
  // OAuth2 client identifier. Registered via admin API (CreateApplication).
  // Determines ServiceSector for pairwise sub computation.
  string client_id = 1;
  // Redirect URI. Must match one of the client's registered redirect_uris.
  // Server validates exact match (RFC 6749 §3.1.2.3).
  string redirect_uri = 2;
  // OAuth2 response type. "code" (authorization code flow, recommended),
  // "token" (implicit flow, discouraged for SPAs). RFC 6749 §3.1.1.
  string response_type = 3;
  // Space-separated OAuth2 scopes. "openid" required for OIDC.
  // Server intersects with client's allowed scopes. RFC 6749 §3.3.
  optional string scope = 4;
  // Opaque CSRF protection value. Echoed in response. RFC 6749 §4.1.1.
  optional string state = 5;
  // PKCE code challenge. Base64url-encoded SHA-256 hash of code_verifier.
  // Required for public clients, recommended for all. RFC 7636 §4.2.
  optional string code_challenge = 6;
  // PKCE challenge method. Must be "S256" (plain not supported). RFC 7636 §4.3.
  optional string code_challenge_method = 7;
  // OIDC nonce. Binds ID token to client session. Echoed in id_token.
  // OpenID Connect Core §3.1.2.1.
  optional string nonce = 8;
  // Space-separated ACR values for step-up authentication (RFC 9470).
  // If session doesn't meet the requested level, step-up is triggered.
  // Values: "urn:sid:acr:basic", "urn:sid:acr:standard", "urn:sid:acr:elevated".
  optional string acr_values = 9;
}

message OAuth2AuthorizeResponse {
  oneof result {
    // Authorization code (authorization code flow). Short-lived, single-use.
    // Client exchanges for tokens via OAuth2Token. RFC 6749 §4.1.2.
    string authorization_code = 1;
    // Access token (implicit flow). Returned directly in fragment. RFC 6749 §4.2.2.
    string access_token = 2;
    // OAuth2 error code (e.g., "access_denied", "invalid_scope"). RFC 6749 §4.1.2.1.
    string error = 3;
  }
  // Echoed from request. Client validates match for CSRF protection.
  optional string state = 4;
}

message OAuth2TokenRequest {
  // Grant type. Determines which other fields are required. RFC 6749 §4.
  // "authorization_code": requires code, redirect_uri, client_id, code_verifier.
  // "refresh_token": requires refresh_token, client_id.
  // "client_credentials": requires client_id, client_secret (or client_assertion).
  // "urn:ietf:params:oauth:grant-type:token-exchange": RFC 8693 token exchange.
  string grant_type = 1;
  // Authorization code from OAuth2Authorize response. Single-use, short-lived (10 min).
  // Required for authorization_code grant. RFC 6749 §4.1.3.
  optional string code = 2;
  // Must match the redirect_uri from the original authorize request.
  // Required for authorization_code grant. RFC 6749 §4.1.3.
  optional string redirect_uri = 3;
  // Client identifier. Required for public clients, optional for confidential
  // (when using client_secret or client_assertion). RFC 6749 §2.2.
  optional string client_id = 4;
  // Client secret for confidential clients. Sent in body (not Basic auth).
  // Mutually exclusive with client_assertion. RFC 6749 §2.3.1.
  optional string client_secret = 5;
  // Refresh token for token renewal. Required for refresh_token grant.
  // Long-lived, rotated on use (N-family with theft detection). RFC 6749 §6.
  optional string refresh_token = 6;
  // PKCE code verifier. Server computes SHA-256 and compares with stored
  // code_challenge from authorize step. Required when code_challenge was sent.
  // RFC 7636 §4.5.
  optional string code_verifier = 7;
  // DPoP proof JWT binding the token to client's ephemeral key pair.
  // If present, server issues DPoP-bound tokens instead of Bearer. RFC 9449 §4.
  optional string dpop_proof = 8;
  // Requested scopes (space-separated). For refresh: must be subset of original.
  // RFC 6749 §3.3.
  optional string scope = 9;
  // Signed JWT assertion for private_key_jwt client authentication.
  // Alternative to client_secret for confidential clients. RFC 7523 §2.2.
  optional string client_assertion = 10;
  // Assertion type URN. Must be "urn:ietf:params:oauth:client-assertion-type:jwt-bearer".
  // Required when client_assertion is present. RFC 7523 §2.2.
  optional string client_assertion_type = 11;
  // Subject token for token exchange (impersonation/delegation). The token
  // identifying the subject of the exchange (e.g., user's access_token).
  // Required for token-exchange grant. RFC 8693 §2.1.
  optional string subject_token = 12;
  // Subject token type URN. "urn:ietf:params:oauth:token-type:access_token" or
  // "urn:ietf:params:oauth:token-type:id_token". RFC 8693 §2.1.
  optional string subject_token_type = 13;
}

message OAuth2TokenResponse {
  // Access token (JWT or opaque). Bearer or DPoP-bound depending on request.
  string access_token = 1;
  // Token type: "Bearer" (default) or "DPoP" (when dpop_proof was in request).
  // RFC 6749 §5.1.
  string token_type = 2;
  // Token lifetime in seconds. Client schedules refresh before expiry.
  int64 expires_in = 3;
  // Refresh token for obtaining new access tokens. Issued for authorization_code
  // and refresh_token grants. Rotated on each use (previous token invalidated
  // after N-family grace window). Not issued for client_credentials.
  optional string refresh_token = 4;
  // OIDC ID token (JWT). Issued when "openid" scope requested. Contains: sub,
  // iss, aud, exp, iat, nonce, at_hash, auth_time, amr, acr. OpenID Connect Core §2.
  optional string id_token = 5;
  // Granted scopes (space-separated). May differ from requested if server
  // reduced scope. RFC 6749 §5.1.
  optional string scope = 6;
}

message OAuth2IntrospectRequest {
  // Token to introspect (access_token or refresh_token). RFC 7662 §2.1.
  string token = 1;
}

message OAuth2IntrospectResponse {
  // Whether the token is currently active (not expired, not revoked). RFC 7662 §2.2.
  bool active = 1;
  // Scopes associated with the token (space-separated).
  optional string scope = 2;
  // Client that the token was issued to.
  optional string client_id = 3;
  // Human-readable identifier for the resource owner (may be email or username).
  optional string username = 4;
  // Token expiration time (Unix timestamp, seconds).
  optional int64 exp = 5;
  // Token issue time (Unix timestamp, seconds).
  optional int64 iat = 6;
  // Subject identifier (polymorphic: ProfileId UUID for public, pairwise hash
  // for pairwise clients). See CLAUDE.md Identity Terminology for sub semantics.
  optional string sub = 7;
}

message OAuth2RevokeRequest {
  // Token to revoke (access or refresh). RFC 7009 §2.1.
  // Server always returns success (even if token unknown — anti-enumeration).
  string token = 1;
  // Hint to server about token type. "access_token" or "refresh_token".
  // Server validates independently — hint is optimization, not trusted. RFC 7009 §2.1.
  optional string token_type_hint = 2;
}

message OAuth2RevokeResponse {}

// ══════════════════════════════════════════════════════════════════════════
// Session validation (internal, forward-auth).
// Used by sid-auth proxy to validate session tokens on behalf of upstream apps.
// ══════════════════════════════════════════════════════════════════════════

message ValidateSessionRequest {
  // Session ID to validate (UUIDv7). Obtained from JWT sid claim or cookie.
  string session_id = 1;
}

message ValidateSessionResponse {
  // Whether the session is active and not expired.
  bool valid = 1;
  // Profile ID of the session owner (UUID). Set only when valid=true.
  optional string profile_id = 2;
  // Scopes granted to this session.
  repeated string scopes = 3;
  // Session expiration timestamp. Set only when valid=true.
  optional google.protobuf.Timestamp expires_at = 4;
}

// ══════════════════════════════════════════════════════════════════════════
// Device Authorization Grant (RFC 8628).
//
// Flow: device requests authorization → user enters code on separate device
// (phone/laptop) → device polls for token. Used for TVs, CLIs, IoT.
// ══════════════════════════════════════════════════════════════════════════

message DeviceAuthorizationRequest {
  // OAuth2 client identifier of the device application. RFC 8628 §3.1.
  string client_id = 1;
  // Requested scopes (space-separated). RFC 8628 §3.1.
  optional string scope = 2;
}

message DeviceAuthorizationResponse {
  // Opaque device verification code. Device uses this to poll for tokens.
  // Not shown to user. RFC 8628 §3.2.
  string device_code = 1;
  // Short alphanumeric code displayed to user (e.g., "ABCD-1234").
  // User enters this on the verification page. RFC 8628 §3.2.
  string user_code = 2;
  // URL where user enters the user_code (e.g., "https://sid.example.com/device").
  // RFC 8628 §3.2.
  string verification_uri = 3;
  // Complete URL with code pre-filled (e.g., "https://sid.example.com/device?code=ABCD-1234").
  // QR code target. RFC 8628 §3.2 RECOMMENDS inclusion.
  string verification_uri_complete = 4;
  // Lifetime of device_code and user_code in seconds (default 600 = 10 min).
  int32 expires_in = 5;
  // Minimum polling interval in seconds. Device must not poll faster. RFC 8628 §3.2.
  int32 interval = 6;
}

message PollDeviceTokenRequest {
  // OAuth2 client identifier (same as in DeviceAuthorizationRequest).
  string client_id = 1;
  // Device code from DeviceAuthorizationResponse. RFC 8628 §3.4.
  string device_code = 2;
}

message SubmitDeviceUserCodeRequest {
  // User code entered by user on the verification page.
  string user_code = 1;
  // Whether user approves the device. true = grant, false = deny.
  bool approve = 2;
}

message SubmitDeviceUserCodeResponse {
  // Client name of the device application (for UI confirmation display).
  string client_id = 1;
  // Scopes requested by the device application.
  optional string scope = 2;
  // Whether the authorization is complete (user approved or denied).
  bool completed = 3;
}

// ══════════════════════════════════════════════════════════════════════════
// Magic Link (passwordless authentication for corporate profiles).
//
// Flow: user enters email → server sends magic link → user clicks →
// server verifies token → issues session. No password involved.
// Used for corporate SSO profiles that don't have OPAQUE credentials.
// ══════════════════════════════════════════════════════════════════════════

message RequestMagicLinkRequest {
  // User-provided login identifier. Server sends magic link to this email/phone.
  // Anti-enumeration: server returns success even if principal doesn't exist.
  string principal = 1;
  // OAuth2 client that initiated the magic link flow (determines redirect).
  string client_id = 2;
  // Where to redirect user after successful verification.
  // Must match registered redirect_uris for the client.
  string redirect_uri = 3;
}

message RequestMagicLinkResponse {
  // Magic link session ID. Client may display "check your email" with this reference.
  string session_id = 1;
  // Magic link validity in seconds (default 600 = 10 min).
  int32 expires_in = 2;
}

message VerifyMagicLinkRequest {
  // Session ID from the magic link URL query parameter.
  string session_id = 1;
  // Cryptographic token from the magic link URL. Single-use, server-validated.
  string token = 2;
}

message VerifyMagicLinkResponse {
  // New session ID (different from magic link session — this is the auth session).
  string session_id = 1;
  // JWT access token (same semantics as OpaqueLoginFinishResponse.access_token).
  string access_token = 2;
  // Token lifetime in seconds.
  int32 expires_in = 3;
}

// ══════════════════════════════════════════════════════════════════════════
// Unified login flow (principal-first).
//
// Client sends identifier → server resolves available auth methods.
// UI then presents method selector (password, passkey, magic link, etc.).
// Anti-enumeration: returns plausible methods even for non-existent principals.
// ══════════════════════════════════════════════════════════════════════════

message ResolvePrincipalRequest {
  // User-provided login identifier (email, phone, or username).
  string principal = 1;
}

message ResolvePrincipalResponse {
  // Auth methods available for this principal: "opaque", "webauthn", "magic_link".
  // For non-existent principals, returns plausible defaults (anti-enumeration).
  repeated string available_methods = 1;
  // Server-suggested method based on user's last successful login.
  // UI may highlight this as the default option.
  optional string suggested_method = 2;
}

// ══════════════════════════════════════════════════════════════════════════
// Legacy password migration (transparent on-login OPAQUE re-registration).
//
// For users imported from legacy systems (bcrypt, scrypt, PBKDF2).
// Step 1: Client sends plaintext password (TLS REQUIRED) + OPAQUE registration request.
//   Server verifies against legacy hash, starts OPAQUE registration.
// Step 2: Client finishes OPAQUE registration. Server replaces legacy hash
//   with OPAQUE credential and issues session.
// After migration: user logs in via normal OPAQUE flow.
// ══════════════════════════════════════════════════════════════════════════

message LegacyMigrateStartRequest {
  // User-provided login identifier.
  string principal = 1;
  // Plaintext password. ONLY used for legacy hash verification — server verifies
  // against stored bcrypt/scrypt/PBKDF2 hash, then discards immediately.
  // SECURITY: TLS REQUIRED. This is the only RPC that transmits plaintext password.
  // After successful migration, this field is never needed again.
  string password = 2;
  // OPAQUE RegistrationRequest for the new credential. Client generates
  // simultaneously with sending password — so migration is atomic.
  bytes opaque_registration_request = 3;
}

message LegacyMigrateStartResponse {
  // Opaque server-side migration state token. 5-minute TTL.
  // Client echoes in Finish to complete the migration.
  string migration_token = 1;
  // OPAQUE RegistrationResponse for client to compute registration record.
  bytes opaque_registration_response = 2;
}

message LegacyMigrateFinishRequest {
  // Echoed from LegacyMigrateStartResponse.migration_token.
  string migration_token = 1;
  // OPAQUE RegistrationRecord computed by client. Server stores as new credential,
  // deletes legacy hash. Migration complete.
  bytes opaque_registration_record = 2;
}

message LegacyMigrateFinishResponse {
  // Session ID (same semantics as OpaqueLoginFinishResponse).
  string session_id = 1;
  // JWT access token.
  string access_token = 2;
  // Token lifetime in seconds.
  int64 expires_in = 3;
}

// ══════════════════════════════════════════════════════════════════════════
// ZKPP policy query (public endpoint, no auth required).
//
// Client fetches current password policy parameters to generate ZK proof.
// Policy version is included to detect stale proofs.
// ══════════════════════════════════════════════════════════════════════════

message GetZkppPolicyRequest {}

message GetZkppPolicyResponse {
  // Policy version number. Monotonically increasing. Client includes in
  // registration/change requests for version negotiation.
  uint32 policy_version = 1;
  // Minimum password length (characters, not bytes).
  uint32 min_length = 2;
  // Minimum number of uppercase Latin letters (A-Z).
  uint32 min_uppercase = 3;
  // Minimum number of lowercase Latin letters (a-z).
  uint32 min_lowercase = 4;
  // Minimum number of decimal digits (0-9).
  uint32 min_digit = 5;
  // Minimum number of symbol characters (non-alphanumeric ASCII).
  uint32 min_symbol = 6;
}

// ══════════════════════════════════════════════════════════════════════════
// Deferred ZK proof submission (no-WASM fallback).
//
// User registered via OPAQUE-ZKPP without ZK proof (WASM unavailable).
// They have 24h to submit proof from a WASM-capable device.
// If deadline expires, login is blocked until password re-registration.
// Requires Bearer auth (proof is for the caller's own credential).
// ══════════════════════════════════════════════════════════════════════════

message SubmitDeferredZkProofRequest {
  // Credential ID to verify (must belong to the Bearer token's profile).
  string credential_id = 1;
  // Halo2 ZK proof (same format as OpaqueZkppRegistrationStartRequest.zkpp_proof).
  bytes zkpp_proof = 2;
  // Public instances (same format as OpaqueZkppRegistrationStartRequest.instances).
  repeated bytes instances = 3;
  // Policy version the proof was generated against (version negotiation).
  uint32 policy_version = 4;
}

message SubmitDeferredZkProofResponse {
  // Whether the proof was successfully verified. If true, credential is now
  // fully verified and the 24h deadline is cleared.
  bool verified = 1;
}

// ══════════════════════════════════════════════════════════════════════════
// MFA TOTP enrollment and verification (RFC 6238).
//
// Enrollment: server generates secret → client displays QR → user scans with
// authenticator app → client submits verification code → server confirms.
// Verification: during MFA challenge, user enters 6-digit code from app.
// ══════════════════════════════════════════════════════════════��═══════════

// Empty request — profile resolved from Bearer token.
message StartTotpEnrollmentRequest {}

message TotpEnrollmentChallenge {
  // TOTP shared secret, Base32-encoded (RFC 4648). Used by authenticator apps.
  // 20 bytes of entropy, suitable for HMAC-SHA1 (RFC 6238 default).
  // SECURITY: displayed to user only during enrollment, never again.
  string secret = 1;
  // Full otpauth:// URI for QR code generation. Encodes secret, issuer,
  // account, algorithm, digits, period. RFC 6238 + Google Authenticator spec.
  // Server is format authority (client should not construct this manually).
  string qr_uri = 2;
  // Issuer name displayed in authenticator app (e.g., "StructuredID").
  // Server-configured (RealmSettings.display_name).
  string issuer = 3;
  // Account identifier displayed in authenticator app (e.g., user's email).
  // Server resolves from profile's primary email or username.
  string account_name = 4;
}

message FinishTotpEnrollmentRequest {
  // 6-digit TOTP code from authenticator app. Server verifies against
  // the secret from StartTotpEnrollment. One-time window (±1 period).
  string code = 1;
}

message FinishTotpEnrollmentResponse {
  // UUID of the newly created TOTP credential.
  string credential_id = 1;
  // 12 single-use recovery codes. Generated only if this is the user's
  // first MFA factor (no existing TOTP, WebAuthn, or recovery codes).
  // Client must display these once — server stores hashed, not plaintext.
  repeated string recovery_codes = 2;
}

message VerifyTotpRequest {
  // 6-digit TOTP code from authenticator app. Server verifies against
  // stored secret with ±1 period tolerance (RFC 6238 §5.2).
  string code = 1;
}

// Shared response for MFA verification (TOTP, SMS, recovery).
// Used by VerifyTotp, VerifySmsMfa, and VerifyRecoveryCode RPCs.
message MfaVerifyResponse {
  // Whether the MFA code was correct.
  bool verified = 1;
  // New session ID after MFA elevation (session refreshed with amr updated).
  // Set when verified=true and this was the last required MFA step.
  optional string session_id = 2;
  // New JWT access token with updated amr (auth methods reference) claim.
  // Set when verified=true and authentication is now complete.
  optional string access_token = 3;
  // Token lifetime in seconds.
  optional int64 expires_in = 4;
  // Next step in the authentication flow, if any. Server determines based on
  // policy (e.g., terms acceptance, profile completion). Empty if login is complete.
  optional string redirect_to = 5;
  // Number of remaining unused recovery codes. Set only for VerifyRecoveryCode
  // responses — helps user know when to generate new codes.
  optional int32 remaining_codes = 6;
}

// ══════════════════════════════════════════════════════════════════════════
// MFA SMS
// ══════════════════════════════════════════════════════════════════════════

message VerifySmsMfaRequest {
  string code = 1;             // 6-digit SMS code
}

message ResendSmsMfaRequest {}

message ResendSmsMfaResponse {
  int32 expires_in = 1;        // Seconds until code expires
  string masked_phone = 2;     // e.g. "+1 *** *** 1234"
}

// ══════════════════════════════════════════════════════════════════════════
// MFA Recovery Codes
// ══════════════════════════════════════════════════════════════════════════

message GenerateRecoveryCodesRequest {}

message GenerateRecoveryCodesResponse {
  repeated string codes = 1;  // 12 single-use recovery codes
}

message VerifyRecoveryCodeRequest {
  string code = 1;
}

// ══════════════════════════════════════════════════════════════════════════
// OTP verification (email/phone, non-MFA context)
// ══════════════════════════════════════════════════════════════════════════

message RequestOtpRequest {
  string principal = 1;            // Email address
}

message RequestOtpResponse {
  string otp_session_id = 1;      // Opaque reference for verify/resend
  string masked_target = 2;       // "a****@example.com"
  uint32 expires_in_seconds = 3;  // 600
  uint32 code_length = 4;         // 8
}

message VerifyOtpRequest {
  string code = 1;             // 8-digit OTP code
  optional string session_id = 2;
}

message VerifyOtpResponse {
  bool verified = 1;
  optional string redirect_to = 2;
  // Provisional session the verified code opened (set only when verified).
  // Mailbox possession grants provisional scopes only: it cannot add or
  // change a credential of an existing account.
  optional string session_id = 3;
  // Access token of that provisional session (same semantics as
  // OpaqueLoginFinishResponse.access_token, restricted scopes).
  optional string access_token = 4;
  // Access token lifetime in seconds.
  optional int64 expires_in = 5;
}

message ResendOtpRequest {
  optional string session_id = 1;
}

message ResendOtpResponse {
  int32 expires_in = 1;
}

// ══════════════════════════════════════════════════════════════════════════
// Email/Phone verification
// ══════════════════════════════════════════════════════════════════════════

message ResendEmailVerificationRequest {
  optional string email = 1;  // If absent, uses session's email
}

message ResendEmailVerificationResponse {
  string masked_email = 1;    // e.g. "a***@example.com"
  int32 expires_in = 2;
}

message VerifyPhoneRequest {
  string code = 1;            // 6-digit verification code
}

message VerifyPhoneResponse {
  bool verified = 1;
  optional string redirect_to = 2;
}

message ResendPhoneVerificationRequest {}

message ResendPhoneVerificationResponse {
  string masked_phone = 1;
