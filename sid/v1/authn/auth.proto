// ══════════════════════════════════════════════════════════════════════════
// Password reset (CE: simple credential replacement)
// SaaS extends with: recovery shard RPCs, key recovery — in proto-ee.
// ══════════════════════════════════════════════════════════════════════════

message RequestPasswordResetRequest {
  string principal = 1;            // email, phone, or username
  string client_id = 2;           // OAuth2 client (for redirect)
  string redirect_uri = 3;
  string captcha_token = 4;       // If CAPTCHA required
}

message RequestPasswordResetResponse {
  string message = 1;             // Always "If account exists, reset email sent" (anti-enum)
}

message VerifyPasswordResetRequest {
  string session_id = 1;
  string token = 2;
}

message VerifyPasswordResetResponse {
  string reset_session_id = 1;   // Authenticated reset session
  int32 expires_in = 2;          // Reset session TTL (seconds)
  // SaaS extends with: account_id, server_pepper, RecoverySourcesInfo (in proto-ee)
}

message CompletePasswordResetRequest {
  string reset_session_id = 1;

  // New OPAQUE credential (client calls OpaqueRegistrationStart separately first,
  // then computes registration_record from the server's RegistrationResponse).
  bytes registration_record = 2;

  // ZK policy proof (optional, deferred if no WASM)
  bytes zkpp_proof = 3;
  repeated bytes zkpp_instances = 4;
  bytes history_commitment = 5;
  bytes commitment_salt = 6;
  // SaaS extends with: wrapped_data_key, encrypted_shard_a/b/c (in proto-ee)
}

message CompletePasswordResetResponse {
  string session_id = 1;
  string access_token = 2;
  int32 expires_in = 3;
}
