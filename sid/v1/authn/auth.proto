// ══════════════════════════════════════════════════════════════════════════
// Dynamic prompt (EE custom auth steps)
// ══════════════════════════════════════════════════════════════════════════

message GetDynamicPromptRequest {
  string prompt_id = 1;
}

// Field type for EE dynamic prompt fields.
enum DynamicPromptFieldType {
  DYNAMIC_PROMPT_FIELD_TYPE_UNSPECIFIED = 0;
  DYNAMIC_PROMPT_FIELD_TYPE_TEXT = 1;       // Free-text input
  DYNAMIC_PROMPT_FIELD_TYPE_EMAIL = 2;      // Email input with validation
  DYNAMIC_PROMPT_FIELD_TYPE_PASSWORD = 3;   // Masked password input
  DYNAMIC_PROMPT_FIELD_TYPE_SELECT = 4;     // Dropdown (uses options field)
  DYNAMIC_PROMPT_FIELD_TYPE_BOOLEAN = 5;    // Checkbox / toggle
  DYNAMIC_PROMPT_FIELD_TYPE_INFO = 6;       // Read-only informational text (no input)
}

message DynamicPromptField {
  // Machine-readable field identifier (used as key in SubmitDynamicPrompt values map).
  string name = 1;
  // Human-readable label displayed to the user.
  string label = 2;
  // Field input type. Determines UI rendering: text input, dropdown, checkbox, etc.
  DynamicPromptFieldType field_type = 3;
  // Whether the field must be filled before form submission.
  bool required = 4;
  // Available options for SELECT field type. Ignored for other types.
  repeated DynamicPromptOption options = 5;
}

message DynamicPromptOption {
  string label = 1;
  string value = 2;
}

message DynamicPrompt {
  string title = 1;
  optional string description = 2;
  optional string submit_label = 3;
  bool cancelable = 4;
  repeated DynamicPromptField fields = 5;
}

message SubmitDynamicPromptRequest {
  string prompt_id = 1;
  map<string, string> values = 2;
}

message SubmitDynamicPromptResponse {
  optional string redirect_to = 1;
}

// ══════════════════════════════════════════════════════════════════════════
// Step-up authentication (D006: Pattern D — 2-phase)
//
// 1-phase methods (TOTP, Recovery): call CompleteStepUp directly.
// 2-phase methods (WebAuthn): RequestStepUp → challenge → CompleteStepUp.
// ══════════════════════════════════════════════════════════════════════════

// Step-up method selector.
enum StepUpMethod {
  STEP_UP_METHOD_UNSPECIFIED = 0;
  STEP_UP_METHOD_TOTP = 1;           // 1-phase: CompleteStepUp only
  STEP_UP_METHOD_WEBAUTHN = 2;       // 2-phase: RequestStepUp → CompleteStepUp
  STEP_UP_METHOD_RECOVERY_CODE = 3;  // 1-phase: CompleteStepUp only
}

// Phase 1: Request challenge (WebAuthn, future: Push). Skipped for TOTP/recovery.
message RequestStepUpRequest {
  string session_id = 1;
  StepUpMethod method = 2;
}

// Challenge response from Phase 1.
message StepUpChallenge {
  StepUpMethod method = 1;
  string challenge_id = 2;          // Opaque reference for CompleteStepUp
  oneof challenge {
    bytes webauthn_options = 3;      // PublicKeyCredentialRequestOptions (JSON)
  }
  // Available step-up methods at current session decay level (#666).
  // Populated by RequestStepUp based on enrolled methods + decay filtering.
  // Frontend uses this to show only valid method buttons.
  repeated StepUpMethod allowed_methods = 4;
  // Current session decay level: "full", "high", "medium", "low".
  string decay_level = 5;
}

// Phase 2: Submit proof → elevate session.
message CompleteStepUpRequest {
  string session_id = 1;
  StepUpMethod method = 2;
  string challenge_id = 3;          // From StepUpChallenge (empty for 1-phase)
  oneof proof {
    string totp_code = 4;
    bytes webauthn_assertion = 5;    // AuthenticatorAssertionResponse (JSON)
    string recovery_code = 6;
  }
}

// Elevated session response.
message CompleteStepUpResponse {
  string new_session_token = 1;     // Rotated token with elevated assurance
  string acr = 2;                   // New assurance level (urn:sid:acr:elevated)
  repeated string amr = 3;          // Updated auth methods
}

