  string challenge_id = 1;
  string token = 2;            // Provider-specific response token
}

message VerifyCaptchaResponse {
  bool verified = 1;
  optional string redirect_to = 2;
  // Single-use pass for the sign-in the challenge was asked of: the same
  // profile from the same client address, within 60 seconds. Sent back as
  // `captcha-pass` metadata on the retry; it answers the CAPTCHA requirement
  // only, never a lockout or a block.
  string bypass_token = 3;
