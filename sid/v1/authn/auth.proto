// ══════════════════════════════════════════════════════════════════════════
// Password reset (credential replacement)
// ══════════════════════════════════════════════════════════════════════════

message RequestPasswordResetRequest {
  string principal = 1;            // email, phone, or username
  string client_id = 2;           // OAuth2 client (for redirect)
  string redirect_uri = 3;
  string captcha_token = 4;       // If CAPTCHA required
}

message RequestPasswordResetResponse {
  string message = 1;             // Always "If account exists, reset email sent" (anti-enum)
}

message VerifyPasswordResetRequest {
  string session_id = 1;
  string token = 2;
}

message VerifyPasswordResetResponse {
  string reset_session_id = 1;   // Authenticated reset session
  int32 expires_in = 2;          // Reset session TTL (seconds)
  // The history context of the replacement password: its operation ID, the
  // owner's history domain and the comparison domains it is checked in. The
  // reset needs no old password: the retained history is the owner's, not the client's.
  PasswordHistoryContext history = 3;
}

message ExecutePasswordResetRequest {
  // The reset operation (from VerifyPasswordResetResponse.history). Carries
  // the verified reset session's authority; no bearer token is involved.
  sid.v1.ids.PasswordOperationId operation_id = 1;
  // OPAQUE RegistrationRequest (Pallas curve) for the replacement password.
  // Client-generated by the WASM module, as in registration.
  bytes registration_request = 2;
}

message ExecutePasswordResetResponse {
  // Server's OPAQUE RegistrationResponse for the replacement password. The
  // client computes the final RegistrationRecord from it for CompletePasswordReset.
  bytes registration_response = 1;
}

message CompletePasswordResetRequest {
  string reset_session_id = 1;
  // The reset operation (from VerifyPasswordResetResponse.history).
  sid.v1.ids.PasswordOperationId operation_id = 7;
  // Final OPAQUE RegistrationRecord of the replacement password, computed from
  // ExecutePasswordResetResponse.registration_response.
  bytes registration_record = 2;
  // The registration proof for the replacement password; absent when the
  // client cannot prove, in which case it installs policy-unverified.
  PasswordRegistrationProof proof = 8;
  // History lives server-side; the proof is PasswordRegistrationProof.
  reserved 3, 4, 5, 6;
  reserved "zkpp_proof", "zkpp_instances", "history_commitment", "commitment_salt";
}

message CompletePasswordResetResponse {
  string session_id = 1;
  string access_token = 2;
  int32 expires_in = 3;
}
