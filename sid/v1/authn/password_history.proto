// StructuredID private password history: the VOPRF evaluator interface and the
// history context a password-installing operation carries.
//
// A password registration, change or authorized reset checks the new password
// against the owner's retained history without the server learning it. The
// client blinds a history input derived from the password, the evaluator
// (holding the owner's history key) evaluates it, and the client proves in its
// registration proof that the resulting tags come from the password it
// registers. The history checker, a separate authority, verifies that proof and
// the evaluator's proofs, stretches each tag with the history KSF and compares
// it with the retained entries. The evaluator never sees a tag or an entry; the
// checker never holds an evaluator key. Which replaced keys are still needed is
// told to the evaluator by the credential service as the set of domains that
// hold entries (PreparePasswordHistoryRequest), never derived from the entries.
syntax = "proto3";

package sid.v1.authn;

import "google/api/annotations.proto";
import "sid/v1/ids/ids.proto";

// The VOPRF evaluator of password history. Deployed with its own service
// identity and key access, separate from the credential service that runs the
// history checker.
service PasswordHistoryEvaluatorService {
  // Evaluate the blinded history input of a pending password operation under
  // every history key the operation requires, in one bounded request. The
  // operation, not the caller, decides which keys; the work is charged to the
  // operation and its owner before any key is used, and an exact retry returns
  // the same charged evaluations.
  rpc EvaluatePasswordHistory(EvaluatePasswordHistoryRequest) returns (EvaluatePasswordHistoryResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/auth/password-history/evaluate" body: "*" };
  }

  // Select the comparison domains of a password operation the credential
  // service has just stored: the owner's current history key, created or
  // replaced here when it has none or a stale one (keys are made, sealed and
  // used only by the evaluator), followed by every replaced key whose domain
  // the request names as still holding a retained password. The owner comes
  // from the stored operation, never from the request. Called only by the
  // credential service, under its own service identity; deliberately not
  // exposed over HTTP. Repeating the call for the same operation returns the
  // same domains.
  //
  // The request is also how the evaluator learns the owner's history
  // lifecycle without seeing an entry or a tag. It keeps, durably and shared
  // by every replica, the newest revision and live set it has accepted per
  // owner; one revision has exactly one live set, and a request naming
  // another set for an accepted revision fails. A replaced key is retired
  // only when it is absent from the live set of the newest accepted revision
  // and no operation that used it is still pending: an operation's pin is
  // released only when an accepted revision names it as settled, so a commit
  // not yet announced never loses its key; a lost reply or a timeout settles
  // nothing.
  // Retirement stops new use; destroying the retired key follows the
  // history's recovery custody and restore points, never earlier.
  rpc PreparePasswordHistory(PreparePasswordHistoryRequest) returns (PreparePasswordHistoryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message PreparePasswordHistoryRequest {
  // The pending operation whose domains are selected, as the credential
  // service stored it.
  sid.v1.ids.PasswordOperationId operation_id = 1;
  // The comparison domains (PasswordHistoryDomain.comparison_domain, 32 bytes
  // each) in which the owner still retains at least one entry, as of
  // history_revision. Only the credential service, which holds the entries,
  // knows this; it commits the set with the entries it describes. Each must be
  // a domain the evaluator issued for this owner; an unknown one fails the call.
  repeated bytes live_comparison_domains = 2;
  // The owner's history revision the live domains belong to: increases with
  // every committed change of the owner's entries or retention, committed with
  // them. The evaluator acts on the newest revision it has accepted for the
  // owner and never retires a key on an older one, so a delayed or retried
  // request cannot retire a key a newer revision still needs.
  uint64 history_revision = 3;
  // The owner's earlier operations this revision settles: each one committed
  // (its entries are in the live set) or can no longer commit (aborted or
  // expired), as the credential service, which runs the commit, recorded with
  // the revision. The evaluator releases their pins; an operation not named
  // stays pinned until a later accepted revision names it.
  repeated sid.v1.ids.PasswordOperationId settled_operations = 4;
}

message PreparePasswordHistoryResponse {
  // The operation's comparison domains, in the order its evaluations and
  // proof follow; the credential service returns them to the client in
  // PasswordHistoryContext.domains.
  repeated PasswordHistoryDomain domains = 1;
}

// What a client needs to build its history request and proof for one
// password operation. Returned by the step that prepares the operation
// (registration start, password-change challenge, password-reset verification).
message PasswordHistoryContext {
  // The operation this context belongs to. Every later step of the operation
  // (evaluation, OPAQUE start, finish) and every retry carries it. Issued by
  // the server when it prepares the operation.
  sid.v1.ids.PasswordOperationId operation_id = 1;
  // The owner's history input domain: 32 bytes, a Pallas base-field element in
  // little-endian canonical form. The client hashes the password under it into
  // the history input it blinds. Server-derived from the credential owner;
  // opaque to the client and unlinkable across installations and owners.
  bytes owner_domain = 2;
  // The comparison domains the operation must produce a tag for, in the order
  // the evaluations and the proof's tags follow. Server-selected from the
  // owner's retained history; at least one. The client cannot omit or reorder
  // one: the proof commits to this list.
  repeated PasswordHistoryDomain domains = 3;
  // Password policy version the registration proof must be made for; the
  // verifying key of that version and domain count checks it.
  uint32 policy_version = 4;
}

// One comparison domain: the epoch, key and format under which a tag is
// compared with the entries retained in it.
message PasswordHistoryDomain {
  // The domain element: 32 bytes, a Pallas base-field element in little-endian
  // canonical form. Enters the tag derivation, so tags of different domains
  // never compare equal.
  bytes comparison_domain = 1;
  // The evaluator's public key for this domain, k·G: a compressed Pallas point,
  // 32 bytes. The client checks each evaluation proof against it before
  // proving, so a wrong or missing key fails before the costly proof.
  bytes evaluator_public_key = 2;
}

message EvaluatePasswordHistoryRequest {
  // The operation whose required domains are evaluated (from PasswordHistoryContext).
  sid.v1.ids.PasswordOperationId operation_id = 1;
  // The blinded history input B = r·H(u): a compressed Pallas point, 32 bytes,
  // not the identity. Client-computed from the password under the operation's
  // owner domain with a fresh nonzero blind r; reveals nothing about the password.
  bytes blinded_input = 2;
}

message EvaluatePasswordHistoryResponse {
  // One evaluation per required comparison domain, in the order of
  // PasswordHistoryContext.domains. Either all are present or the call fails.
  repeated PasswordHistoryEvaluation evaluations = 1;
}

// The evaluator's answer for one comparison domain.
message PasswordHistoryEvaluation {
  // Z = k·B under this domain's key: a compressed Pallas point, 32 bytes.
  bytes evaluated_element = 1;
  // Proof that Z uses the key behind this domain's evaluator_public_key
  // (Chaum-Pedersen DLEQ, RFC 9497 §2.2), bound to the operation.
  PasswordHistoryEvaluationProof proof = 2;
}

// Chaum-Pedersen proof of log_G(pk) = log_B(Z). Each domain has its own key,
// so each evaluation carries its own proof.
message PasswordHistoryEvaluationProof {
  // Challenge c: a Pallas scalar, 32 bytes little-endian.
  bytes challenge = 1;
  // Response s = nonce − c·k: a Pallas scalar, 32 bytes little-endian.
  bytes response = 2;
}

// A registration proof for the password being installed: its policy, breach
// and history relation, and that the operation's OPAQUE registration element
// is the blinded hash of that password. The operation ID and the registration
// request bytes enter the proof transcript, so it verifies for no other
// operation or request. Sent with the final registration record, where the
// history checker verifies it and commits the credential. Absent when the
// client cannot prove; the credential then installs policy-unverified and does
// not advance trusted history.
message PasswordRegistrationProof {
  // Halo2 proof bytes. Client-generated with the OPAQUE registration request.
  bytes zkpp_proof = 1;
  // The proof's public instances, 32 bytes each (Pallas base field,
  // little-endian): the OPAQUE registration element M = blind·H(P) (x, y), the
  // owner domain, the comparison domains, the blinded history input (x, y), and
  // per domain the evaluated element (x, y) and the tag. The server checks each
  // against the operation and its registration request; none is accepted from
  // the client on trust.
  repeated bytes instances = 2;
  // Retired field number.
  reserved 3;
}
