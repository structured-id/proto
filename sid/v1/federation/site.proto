// StructuredID federation site: this installation as an enrolled site of
// the federation.
//
// To receive employees of other organizations, an installation is enrolled
// by the platform as a site of its organization. The installation makes one
// key of its own; the organization's manager has the platform certify the
// public half together with the addresses the installation is entered at;
// the installation holds the certificate it gets back. With that key it
// signs statements of whom it admits, which another organization's
// installation checks before sending anyone here.
//
// Nothing here contacts the platform: the request and the certificate are
// carried by the administrator. The installation certifies nothing. A
// statement repeats the installation's stored login settings
// (sid.v1.admin.LoginSettings) and decides nothing: every arrival is decided
// again from the settings in force then.
syntax = "proto3";

package sid.v1.federation;

import "google/api/annotations.proto";
import "sid/v1/common/access.proto";
import "sid/v1/common/operation.proto";
import "sid/v1/ids/ids.proto";

// FederationSiteService manages the installation's enrollment as a site.
// Every RPC requires the administrator role.
service FederationSiteService {
  // What to take to the platform to have this installation enrolled.
  rpc PrepareSiteEnrollment(PrepareSiteEnrollmentRequest) returns (SiteEnrollmentRequest) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.access) = { protected: { credentials: [CREDENTIAL_KIND_OWN_SESSION] } };
    option (sid.v1.common.retry) = {
      natural: "the site's key is made once, on the first call, and kept: every repeat answers the same key and changes nothing"
    };
    option (google.api.http) = {
      post: "/v1/admin/federation-site/enrollment-request"
      body: "*"
    };
  }

  // Hold the certificate the platform issued for this site. It is held only
  // when it is an enrolled site's certificate on a path this installation
  // admits, for this site's key, this installation's organization and only
  // addresses the installation is entered at. A renewal replaces the one
  // held.
  rpc HoldSiteCertificate(HoldSiteCertificateRequest) returns (FederationSite) {
    option idempotency_level = IDEMPOTENT;
    option (sid.v1.common.access) = { protected: { credentials: [CREDENTIAL_KIND_OWN_SESSION] } };
    option (sid.v1.common.retry) = {
      natural: "holding the certificate already held changes nothing and answers the same site"
    };
    option (google.api.http) = {
      put: "/v1/admin/federation-site/certificate"
      body: "*"
    };
  }

  // The site this installation is enrolled as. The held certificate is
  // verified again on every call: one the platform withdrew is refused
  // (FAILED_PRECONDITION), not answered as a site.
  rpc GetFederationSite(GetFederationSiteRequest) returns (FederationSiteState) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (sid.v1.common.access) = { protected: { credentials: [CREDENTIAL_KIND_OWN_SESSION] } };
    option (google.api.http) = {get: "/v1/admin/federation-site"};
  }

  // The site's signed statement of whom this installation admits at one of
  // its entries, as the login settings stand now. Nothing is stored: each
  // call signs the settings in force at that moment.
  rpc SignSiteAdmission(SignSiteAdmissionRequest) returns (SiteAdmission) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (sid.v1.common.access) = { protected: { credentials: [CREDENTIAL_KIND_OWN_SESSION] } };
    option (google.api.http) = {
      post: "/v1/admin/federation-site/admission"
      body: "*"
    };
  }
}

message PrepareSiteEnrollmentRequest {}

// What the organization's manager takes to the platform.
message SiteEnrollmentRequest {
  // The site's public key: a DER SubjectPublicKeyInfo (RFC 5280 §4.1.2.7) of
  // an ECDSA P-256 key. Generated by the server; the private half never
  // leaves the installation.
  bytes public_key = 1;
  // The DNS TXT value that publishes exactly that key,
  // `v=sid1; pubkey=<base64 of public_key>`, to be set at
  // `_sid-fed.<domain>` under a domain the organization has verified.
  string key_record = 2;
  // The addresses this installation is entered at: the exact URLs of its
  // issuers, each an https URL without query or fragment. The certificate
  // may list only these.
  repeated string mounts = 3;
}

message HoldSiteCertificateRequest {
  // The site's participant certificate as the platform issued it: a DER
  // X.509 certificate.
  bytes certificate = 1;
  // The certificates above it (DER), its issuer first; may be empty when
  // the installation already holds the issuing platform certificate.
  repeated bytes chain = 2;
}

// The site an installation is enrolled as, as its certificate states it.
message FederationSite {
  // The organization the site belongs to: this installation's.
  sid.v1.ids.OrgId organization = 1;
  // The site's identifier, assigned by the platform at enrollment: a UUID
  // in canonical text form.
  string site = 2;
  // The addresses the certificate lets the site speak for; as
  // SiteEnrollmentRequest.mounts.
  repeated string mounts = 3;
}

message GetFederationSiteRequest {}

message FederationSiteState {
  // The site; absent while the installation holds no certificate.
  FederationSite site = 1;
}

message SignSiteAdmissionRequest {
  // The entry the statement is about: one of FederationSite.mounts, exactly.
  string mount = 1;
}

message SiteAdmission {
  // The signed statement: a JWS in the General JSON Serialization (RFC 7515
  // §7.2.1) of type `sid-login-admission+jws`, signed with the site's key
  // (ES256, RFC 7518 §3.4). It carries the site's certificate, the entry,
  // the login settings' revision, both admission switches and the complete
  // set of admitted source organizations. Public material: it is handed to
  // the administrator of the organization whose employees are to be sent
  // here.
  bytes statement = 1;
}
