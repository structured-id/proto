// StructuredID CE Governance — Access Requests & Temporary Roles
// 1-step access requests with admin approval, temporary roles with auto-expiry.
// ListRoleAssignments + CheckSodConflicts are in AuthzService (authz.proto).
// EE extends with full IGA: PIM/JIT, review campaigns, entitlement catalog,
// workflow engine, operation gating, key custody (proto-ee governance.proto).
syntax = "proto3";

package sid.v1.authz;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "sid/v1/common/pagination.proto";

// ────────────────────────────────────────────────────────────────────────────
// GovernanceService — CE access lifecycle (4 RPCs)
// SoD checks + role assignment listing → AuthzService (authz.proto)
// ────────────────────────────────────────────────────────────────────────────

service GovernanceService {
  // Request access to a role/permission.
  rpc RequestAccess(AccessRequestMessage) returns (AccessRequestResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/governance/access-requests" body: "*" };
  }

  // List pending access requests (for approver dashboard).
  rpc ListPendingRequests(ListPendingRequestsRequest) returns (ListPendingRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = { get: "/v1/governance/access-requests" };
  }

  // Approve or deny an access request.
  rpc DecideRequest(DecideRequestRequest) returns (DecideRequestResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = { post: "/v1/governance/access-requests/{request_id}/decide" body: "*" };
  }

  // Grant temporary role with auto-expiry.
  rpc GrantTemporaryRole(GrantTemporaryRoleRequest) returns (GrantTemporaryRoleResponse) {
    option idempotency_level = IDEMPOTENCY_UNKNOWN;
    option (google.api.http) = { post: "/v1/governance/temporary-roles" body: "*" };
  }
}

// ══════════════════════════════════════════════════════════════════════════
// Enums
// ══════════════════════════════════════════════════════════════════════════

enum AccessRequestStatus {
  ACCESS_REQUEST_STATUS_UNSPECIFIED = 0;
  ACCESS_REQUEST_STATUS_PENDING = 1;
  ACCESS_REQUEST_STATUS_APPROVED = 2;
  ACCESS_REQUEST_STATUS_DENIED = 3;
  ACCESS_REQUEST_STATUS_EXPIRED = 4;     // Request timed out without decision
  ACCESS_REQUEST_STATUS_CANCELLED = 5;   // Requester cancelled
}

// ══════════════════════════════════════════════════════════════════════════
// Access Requests
// ══════════════════════════════════════════════════════════════════════════

message AccessRequestMessage {
  string requester_profile_id = 1;
  string requested_role = 2;
  string justification = 3;
  optional google.protobuf.Duration requested_duration = 4;  // null = permanent
}

message AccessRequestResponse {
  string request_id = 1;
  AccessRequestStatus status = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListPendingRequestsRequest {
  sid.v1.common.PaginationRequest pagination = 1;
}

message ListPendingRequestsResponse {
  repeated AccessRequestDetail requests = 1;
  sid.v1.common.PaginationResponse pagination = 2;
}

message AccessRequestDetail {
  string request_id = 1;
  string requester_profile_id = 2;
  string requester_display_name = 3;
  string requested_role = 4;
  string justification = 5;
  optional google.protobuf.Duration requested_duration = 6;
  AccessRequestStatus status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;  // Request auto-denied after this
}

message DecideRequestRequest {
  string request_id = 1;
  bool approved = 2;
  string reason = 3;                          // Required for deny, optional for approve
}

message DecideRequestResponse {
  string request_id = 1;
  AccessRequestStatus status = 2;
}

// ══════════════════════════════════════════════════════════════════════════
// Temporary Roles
// ══════════════════════════════════════════════════════════════════════════

message GrantTemporaryRoleRequest {
  string profile_id = 1;
  string role = 2;
  google.protobuf.Timestamp expires_at = 3;
  string justification = 4;
}

message GrantTemporaryRoleResponse {
  string assignment_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}
